openapi: 3.1.0
info:
  title: Рекламная платформа билайна — API кабинета партнёра
  version: 0.2.0
  description: |
    Контракт кабинета партнёра и входа. Источник правды для интерфейса и сервера:
    тест server/contract.test.ts проверяет, что каждый маршрут сервера описан здесь и наоборот.

    Авторизация — cookie `sid` (httpOnly), её ставит вход. Компания и роль берутся из сессии,
    в запросах их не передают. Сменить компанию — POST /auth/company.

    Операции прототипа (prototype-app/api/openapi.yaml) переносятся сюда по мере реализации модулей,
    без демо-полей (`Session.clock`, cookie `demo`). Деньги в ответах — копейки, поля с суффиксом `Kop`.
servers:
  - url: /api
tags:
  - { name: статистика }
  - { name: результаты }
  - { name: документы }
  - { name: кампании }
  - { name: деньги }
  - { name: вход }
  - { name: компания }
  - { name: участники }

paths:
  /auth/providers:
    get:
      tags: [вход]
      summary: Способы входа партнёра
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Provider' } }

  /auth/start:
    post:
      tags: [вход]
      summary: Начать вход через бизнес-ID
      description: Ставит cookie `oauth_state` на 10 минут и возвращает адрес страницы провайдера.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { $ref: '#/components/schemas/ProviderId' }
                next: { type: string, description: 'путь в интерфейсе, куда вернуть после входа, например /approve/<token>; по умолчанию /cabinet' }
      responses:
        '200':
          description: адрес провайдера
          content:
            application/json:
              schema: { type: object, required: [url], properties: { url: { type: string } } }
        '422': { $ref: '#/components/responses/Error' }

  /auth/callback/{provider}:
    get:
      tags: [вход]
      summary: Возврат от провайдера
      description: |
        Меняет code на данные человека. Если провайдер подтвердил полномочия в организации,
        компания создаётся по ИНН, человек становится владельцем и подписантом. Ставит cookie `sid`
        и перенаправляет на `APP_URL` + next из /auth/start (по умолчанию `/cabinet`).
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { $ref: '#/components/schemas/ProviderId' } }
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: в кабинет }
        '422': { $ref: '#/components/responses/Error' }

  /auth/phone/start:
    post:
      tags: [вход]
      summary: Отправить код входа в SMS
      description: Номер мобильный российский, в любом виде (8…, +7…, 9…). Код из 6 цифр, живёт 10 минут, повторно — не раньше чем через минуту. Пока SMS — заглушка, на стенде код приходит в ответе `devCode`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [phone], properties: { phone: { type: string, example: '+7 900 123-45-67' } } }
      responses:
        '200':
          description: код отправлен
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean }, devCode: { type: string, description: 'только на стенде с заглушкой SMS' } } }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/phone/verify:
    post:
      tags: [вход]
      summary: Войти по коду из SMS
      description: Пять неверных попыток — код сгорает. Ставит cookie `sid`, номер записывается как подтверждённый.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties: { phone: { type: string }, code: { type: string, pattern: '^\d{6}$' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }

  /auth/me:
    get:
      tags: [вход]
      summary: Кто вошёл
      responses:
        '200':
          description: партнёр или сотрудник
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MePartner'
                  - $ref: '#/components/schemas/MeStaff'
        '401': { $ref: '#/components/responses/Error' }

  /auth/company:
    post:
      tags: [вход]
      summary: Выбрать компанию
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [companyId], properties: { companyId: { type: string, format: uuid } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [вход]
      summary: Выйти
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /auth/companies:
    post:
      tags: [компания]
      summary: Добавить компанию по ИНН
      description: |
        Для вошедших по почте. Человек становится владельцем без права подписи: оферту и оплату подтвердит
        руководитель, войдя через бизнес-ID. Компания выбирается в сессии, проверка юрлица ставится в очередь.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [inn], properties: { inn: { type: string, pattern: '^\d{10}(\d{2})?$' } } }
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /auth/invitations/{token}/accept:
    post:
      tags: [участники]
      summary: Принять приглашение в компанию
      description: Токен — из ссылки в письме, одноразовый, живёт 7 дней. Компания выбирается в сессии.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: object, required: [ok, companyId], properties: { ok: { const: true }, companyId: { type: string, format: uuid } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /cabinet/company:
    get:
      tags: [компания]
      summary: Текущая компания целиком
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [компания]
      summary: Изменить компанию
      description: Только владелец. Смена реквизитов обновляет контрагента в учётной системе билайна (через очередь).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyPatch' }
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/company/points:
    post:
      tags: [компания]
      summary: Добавить точку продаж
      description: Владелец или сотрудник. Адрес проходит геокодер; не найден — 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [addr], properties: { addr: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/company/points/{pointId}:
    patch:
      tags: [компания]
      summary: Включить или выключить точку в рекламе
      description: Хотя бы одна точка остаётся в рекламе, иначе 422.
      parameters:
        - { name: pointId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [active], properties: { active: { type: boolean } } }
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/company/invitations:
    post:
      tags: [участники]
      summary: Пригласить сотрудника или бухгалтера
      description: Только владелец. Письмо со ссылкой `APP_URL/invite/<token>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties: { email: { type: string, format: email }, role: { type: string, enum: [staff, accountant] } }
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/company/members/{userId}:
    delete:
      tags: [участники]
      summary: Удалить участника
      description: Только владелец, не себя. Сессии участника в этой компании закрываются.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/company/consents:
    post:
      tags: [компания]
      summary: Дать согласие
      description: 'company — обработка данных компании, signer — данных подписанта, profile — использование профиля для подбора аудитории.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [kind], properties: { kind: { type: string, enum: [company, signer, profile] } } }
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/company/consents/{kind}:
    delete:
      tags: [компания]
      summary: Отозвать согласие
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [company, signer, profile] } }
      responses:
        '200': { $ref: '#/components/responses/Company' }

  /cabinet/company/offer:
    post:
      tags: [компания]
      summary: Принять текущую оферту
      description: Только подписант. Повторное принятие той же версии ничего не меняет. Документ «оферта» появляется в документах.
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '403': { $ref: '#/components/responses/Error' }

  /cabinet/company/edo:
    post:
      tags: [компания]
      summary: Подключить ЭДО
      description: Владелец или бухгалтер. Приглашение уходит оператору ЭДО через очередь.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [operator], properties: { operator: { type: string, examples: [Диадок, СБИС] } } }
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }


  /cabinet/balance:
    get:
      tags: [деньги]
      summary: Баланс, операции, неоплаченные счета
      description: |
        Суммы — строки с целым числом копеек (bigint не теряет точность в JSON).
        availableKop = mainKop + bonusKop — сколько можно потратить. Списания идут сначала с бонусов.
        payoutKop — накопленные выплаты за купоны и подписки. operations — последние 100, сумма со знаком.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }

  /cabinet/payments:
    post:
      tags: [деньги]
      summary: Пополнить баланс
      description: |
        Владелец или бухгалтер, компания проверена. sbp и card — возвращают confirmUrl страницы оплаты,
        деньги зачисляются по вебхуку шлюза. invoice — выставляет счёт-оферту (номер РП-ГГГГ-NNNNNN),
        зачисление по выписке банка. Первая успешная оплата даёт бонус. Повтор с тем же idempotencyKey возвращает тот же платёж.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountKop, method, idempotencyKey]
              properties:
                amountKop: { type: [string, integer], description: 'копейки, не меньше settings.min_topup_kop' }
                method: { type: string, enum: [sbp, card, invoice] }
                campaignId: { type: integer, description: 'оплата под кампанию: после зачисления кампания уходит на проверку' }
                idempotencyKey: { type: string }
      responses:
        '200':
          description: платёж создан
          content:
            application/json:
              schema:
                type: object
                required: [payment, confirmUrl, invoice]
                properties:
                  payment: { $ref: '#/components/schemas/Payment' }
                  confirmUrl: { type: [string, 'null'], description: 'куда отправить человека для оплаты (sbp, card)' }
                  invoice: { oneOf: [{ $ref: '#/components/schemas/Invoice' }, { type: 'null' }] }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/payments/{id}:
    get:
      tags: [деньги]
      summary: Статус платежа
      description: Для экрана возврата со страницы оплаты.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '#/components/responses/Error' }


  /cabinet/catalog:
    get:
      tags: [кампании]
      summary: Справочник для сборки кампании
      description: Типы офферов с текстами и полями условий, места показа, продаваемые сигналы, способы оплаты, параметры.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }

  /cabinet/campaigns:
    get:
      tags: [кампании]
      summary: Кампании компании, кроме архивных
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CampaignBrief' } }
    post:
      tags: [кампании]
      summary: Новый черновик
      description: |
        Владелец, сотрудник или агентство. Стартовые условия и текст объявления — по типу оффера, режим сборки — по сегменту компании,
        место показа — «лучшее рядом», бюджет — минимальный, ссылка — сайт компании.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [type], properties: { type: { $ref: '#/components/schemas/OfferType' } } }
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/campaigns/{id}:
    get:
      tags: [кампании]
      summary: Кампания целиком, с креативом, проверкой, оплатой и прогнозом
      parameters: [{ $ref: '#/components/parameters/CampaignId' }]
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [кампании]
      summary: Изменить кампанию
      description: |
        Что можно менять, зависит от статуса. draft и rejected — всё. live и paused — название, места, широкая карточка, ставка,
        бюджет, дневной лимит, дата окончания, текст и картинка, пауза. Новый текст или картинка у отправленной кампании —
        новая версия креатива на проверку; живая кампания показывает прошлую версию, пока новую не одобрят.
        В остальных статусах — 409. Передайте version, чтобы не затереть чужую правку (не совпала — 409).
      parameters: [{ $ref: '#/components/parameters/CampaignId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignPatch' }
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/campaigns/{id}/image:
    post:
      tags: [кампании]
      summary: Загрузить картинку объявления
      description: PNG, JPEG или WebP до 2 МБ. Возвращает imageKey — передайте его в PATCH, чтобы поставить картинку в креатив.
      parameters: [{ $ref: '#/components/parameters/CampaignId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '200':
          description: загружено
          content:
            application/json:
              schema: { type: object, required: [imageKey, imageUrl], properties: { imageKey: { type: string }, imageUrl: { type: string } } }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/campaigns/{id}/submit:
    post:
      tags: [кампании]
      summary: Отправить черновик
      description: |
        Компания должна быть проверена. Подписант запускает сам: принимает оферту (acceptOffer), и если на балансе не хватает
        месячного бюджета — получает платёж на недостающее (не меньше минимального пополнения). Оплатил — кампания на проверке.
        Купон и подписка денег не требуют. Постоплата — только для крупного бизнеса.
        Не подписант получает approvalUrl: ссылку для руководителя, письмо уходит подписантам компании.
      parameters: [{ $ref: '#/components/parameters/CampaignId' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LaunchRequest' }
      responses:
        '200':
          description: результат отправки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaunchResult' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/campaigns/{id}/archive:
    post:
      tags: [кампании]
      summary: Убрать в архив
      description: Черновик, отклонённую, на паузе или завершённую.
      parameters: [{ $ref: '#/components/parameters/CampaignId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Error' }

  /cabinet/approvals/{token}:
    get:
      tags: [кампании]
      summary: Кампания по ссылке руководителю
      description: Нужно войти подписантом той же компании. Ссылка живёт 3 дня (410 — устарела).
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Campaign' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /cabinet/approvals/{token}/confirm:
    post:
      tags: [кампании]
      summary: Подтвердить и запустить
      description: Как отправка подписантом.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LaunchRequest' }
      responses:
        '200':
          description: результат отправки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaunchResult' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }


  /cabinet/documents:
    get:
      tags: [документы]
      summary: Документы компании
      description: |
        Оферта (при принятии), счёт (при выборе оплаты по счёту), акт и счёт-фактура (первого числа за прошлый месяц,
        по списаниям). Статусы: issued — сформирован, sent — отправлен в ЭДО, delivered, signed, rejected — по ответу оператора.
      responses:
        '200':
          description: последние 200
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Document' } }

  /cabinet/documents/{id}/file:
    get:
      tags: [документы]
      summary: Печатная форма документа
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: HTML для просмотра и печати, content: { text/html: { schema: { type: string } } } }
        '404': { $ref: '#/components/responses/Error' }

  /cabinet/special-requests:
    post:
      tags: [кампании]
      summary: Заявка на спецпроект
      description: Игра, свой раздел, розыгрыш, свой сегмент — через менеджера. Заявка уходит в Service desk билайна.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, task, budget]
              properties:
                kind: { type: string, enum: [game, section, raffle, segment] }
                task: { type: string, minLength: 10 }
                budget: { type: string }
      responses:
        '200':
          description: принята
          content:
            application/json:
              schema: { type: object, required: [ok, id], properties: { ok: { const: true }, id: { type: integer } } }
        '422': { $ref: '#/components/responses/Error' }


  /cabinet/campaigns/{id}/stats:
    get:
      tags: [статистика]
      summary: Статистика кампании за период
      description: По умолчанию — последние 14 дней. Показы и клики — из почасовых свёрток (обновляются раз в минуту), результаты и деньги — по событиям.
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/conversions:
    get:
      tags: [результаты]
      summary: Результаты кампаний
      parameters:
        - { name: campaignId, in: query, required: false, schema: { type: integer } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/ConversionStatus' } }
      responses:
        '200':
          description: последние 500
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Conversion' } }

  /cabinet/conversions/{id}:
    patch:
      tags: [результаты]
      summary: Засчитать, оспорить или отметить возврат
      description: Оспорить — до срока на спор. Оплату со счёта телефона билайн подтверждает сам, её не меняют.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [approved, rejected, returned] }, note: { type: string } } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversion' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/conversions/import:
    post:
      tags: [результаты]
      summary: Загрузить результаты файлом CSV
      description: 'Столбцы click_id;order_id;status;amount (разделитель ; , или табуляция), первая строка может быть заголовком, до 2 МБ. Ошибки строк не останавливают загрузку.'
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        '200':
          description: итог
          content:
            application/json:
              schema:
                type: object
                required: [created, updated, errors]
                properties:
                  created: { type: integer }
                  updated: { type: integer }
                  errors: { type: array, items: { type: object, required: [line, message], properties: { line: { type: integer }, message: { type: string } } } }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/tracking:
    get:
      tags: [результаты]
      summary: Подключение сервера партнёра
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [postbackUrl, keys, events, lastEventAt, disputeDays]
                properties:
                  postbackUrl: { type: string, description: шаблон адреса с макросами в фигурных скобках }
                  keys: { type: array, items: { type: object, required: [id, hint, createdAt, lastUsedAt], properties: { id: { type: integer }, hint: { type: string }, createdAt: { type: string, format: date-time }, lastUsedAt: { type: [string, 'null'], format: date-time } } } }
                  events: { type: integer, description: результатов от партнёра всего }
                  lastEventAt: { type: [string, 'null'], format: date-time }
                  disputeDays: { type: object, additionalProperties: { type: integer } }

  /cabinet/tracking/keys:
    post:
      tags: [результаты]
      summary: Новый ключ сервера партнёра
      description: Только владелец. Ключ показывается один раз, храним хеш. Можно держать несколько, чтобы сменить без простоя.
      responses:
        '200':
          description: ключ
          content:
            application/json:
              schema: { type: object, required: [id, key], properties: { id: { type: integer }, key: { type: string } } }
        '403': { $ref: '#/components/responses/Error' }

  /cabinet/tracking/keys/{id}:
    delete:
      tags: [результаты]
      summary: Отозвать ключ
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/Error' }

components:
  parameters:
    CampaignId: { name: id, in: path, required: true, schema: { type: integer } }

  securitySchemes:
    session: { type: apiKey, in: cookie, name: sid }

  responses:
    Ok:
      description: ok
      content:
        application/json:
          schema: { type: object, required: [ok], properties: { ok: { const: true } } }
    Error:
      description: ошибка
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Campaign:
      description: кампания целиком
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Campaign' }
    Company:
      description: компания целиком
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Company' }

  schemas:
    Error:
      type: object
      required: [message]
      properties: { message: { type: string, description: текст для человека } }

    ProviderId: { type: string, enum: [gos, sber, alfa, b2b], description: 'Госуслуги, СберБизнес ID, Альфа ID для бизнеса, ЛК билайн бизнес' }
    Provider:
      type: object
      required: [id, name]
      properties: { id: { $ref: '#/components/schemas/ProviderId' }, name: { type: string } }

    PartnerRole: { type: string, enum: [owner, staff, accountant, agency], description: 'владелец, сотрудник, бухгалтер, агентство' }
    MePartner:
      type: object
      required: [kind, user, companyId, companies]
      properties:
        kind: { const: partner }
        user:
          type: object
          required: [id, name, email, phone]
          properties: { id: { type: string, format: uuid }, name: { type: string }, email: { type: [string, 'null'] }, phone: { type: [string, 'null'] } }
        companyId: { type: [string, 'null'], format: uuid, description: 'выбранная компания; null — компании ещё нет' }
        companies:
          type: array
          items:
            type: object
            required: [id, name, inn, role, signer]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              inn: { type: string }
              role: { $ref: '#/components/schemas/PartnerRole' }
              signer: { type: boolean, description: может принимать оферту и подтверждать оплату }
    MeStaff:
      type: object
      required: [kind, staff]
      properties:
        kind: { const: staff }
        staff:
          type: object
          required: [id, email, name, roles]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            name: { type: string }
            roles: { type: array, items: { type: string, enum: [moderator, manager, finance, admin] } }

    Company:
      type: object
      required: [id, inn, kpp, ogrn, name, brand, segment, kycStatus, kycReason, address, bank, site, phone, notify, edoOperator, autoTopup, offerVersion, offerAcceptedAt, currentOfferVersion, points, members, invitations, consents]
      properties:
        id: { type: string, format: uuid }
        inn: { type: string }
        kpp: { type: [string, 'null'] }
        ogrn: { type: [string, 'null'] }
        name: { type: string, description: 'полное название; после проверки — из ЕГРЮЛ' }
        brand: { type: string, description: как компанию видят абоненты }
        segment: { type: string, enum: [small, medium, large], description: 'задаёт режим сборки: автопилот, ручная настройка, медиаплан' }
        kycStatus: { type: string, enum: [pending, verified, rejected, blocked], description: 'проверка юрлица; запуск кампаний — только verified' }
        kycReason: { type: [string, 'null'], description: почему не проверено }
        address: { type: [string, 'null'], description: юридический адрес из реестра }
        bank:
          oneOf:
            - type: 'null'
            - { type: object, required: [bik, account, bank], properties: { bik: { type: string }, account: { type: string }, bank: { type: string } } }
        site: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        notify: { $ref: '#/components/schemas/Notify' }
        edoOperator: { type: [string, 'null'] }
        autoTopup: { type: boolean }
        offerVersion: { type: [string, 'null'], description: принятая версия оферты }
        offerAcceptedAt: { type: [string, 'null'], format: date-time }
        currentOfferVersion: { type: string, description: 'действующая версия; не совпадает с offerVersion — оферту нужно принять заново' }
        points: { type: array, items: { $ref: '#/components/schemas/Point' } }
        members:
          type: array
          items:
            type: object
            required: [id, name, email, phone, role, title, signer]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              email: { type: [string, 'null'] }
              phone: { type: [string, 'null'] }
              role: { $ref: '#/components/schemas/PartnerRole' }
              title: { type: string }
              signer: { type: boolean }
        invitations:
          type: array
          items:
            type: object
            required: [id, target, role, expiresAt]
            properties: { id: { type: string, format: uuid }, target: { type: string }, role: { type: string }, expiresAt: { type: string, format: date-time } }
        consents:
          type: array
          items:
            type: object
            required: [kind, version, grantedAt]
            properties: { kind: { type: string }, version: { type: string }, grantedAt: { type: string, format: date-time } }
    Point:
      type: object
      required: [id, addr, normalized, lat, lon, active]
      properties:
        id: { type: integer }
        addr: { type: string, description: как ввёл партнёр }
        normalized: { type: [string, 'null'], description: как понял геокодер }
        lat: { type: number }
        lon: { type: number }
        active: { type: boolean, description: в рекламе }
    Notify:
      type: object
      required: [sms, mail, tg]
      properties: { sms: { type: boolean }, mail: { type: boolean }, tg: { type: boolean } }
    CompanyPatch:
      type: object
      properties:
        brand: { type: string }
        segment: { type: string, enum: [small, medium, large] }
        site: { type: string }
        phone: { type: string }
        notify: { $ref: '#/components/schemas/Notify' }
        autoTopup: { type: boolean }
        bank:
          type: object
          required: [bik, account]
          properties: { bik: { type: string, pattern: '^\d{9}$' }, account: { type: string, description: 20 цифр, пробелы допустимы }, bank: { type: string } }

    Kop: { type: string, pattern: '^-?\d+$', description: целое число копеек строкой }
    Payment:
      type: object
      required: [id, method, amountKop, status, campaignId, createdAt]
      properties:
        id: { type: string, format: uuid }
        method: { type: string, enum: [sbp, card, invoice, post] }
        amountKop: { $ref: '#/components/schemas/Kop' }
        status: { type: string, enum: [created, pending, succeeded, failed, refunded] }
        campaignId: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
    Invoice:
      type: object
      required: [id, number, amountKop, status, dueAt, issuedAt, paidAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, examples: [РП-2026-000001] }
        amountKop: { $ref: '#/components/schemas/Kop' }
        status: { type: string, enum: [issued, paid, cancelled] }
        dueAt: { type: [string, 'null'], format: date-time }
        issuedAt: { type: string, format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
    Balance:
      type: object
      required: [mainKop, bonusKop, payoutKop, availableKop, operations, invoices]
      properties:
        mainKop: { $ref: '#/components/schemas/Kop' }
        bonusKop: { $ref: '#/components/schemas/Kop' }
        payoutKop: { $ref: '#/components/schemas/Kop' }
        availableKop: { $ref: '#/components/schemas/Kop' }
        operations:
          type: array
          items:
            type: object
            required: [id, kind, memo, campaignId, amountKop, createdAt]
            properties:
              id: { type: integer }
              kind: { type: string, enum: [topup, charge, bonus, payout, refund, adjustment, commission] }
              memo: { type: string }
              campaignId: { type: [integer, 'null'] }
              amountKop: { $ref: '#/components/schemas/Kop' }
              createdAt: { type: string, format: date-time }
        invoices: { type: array, items: { $ref: '#/components/schemas/Invoice' } }

    OfferType: { type: string, enum: [click, coupon, lead, promo, sub], description: 'переход, купон, заявка, промокод, подписка' }
    CampaignStatus:
      type: string
      enum: [draft, approval, invoice, moderation, rejected, live, paused, finished, archived]
      description: 'черновик, ждёт руководителя, ждёт оплату, проверка, отклонена, показывается, пауза, завершена, архив'
    Catalog:
      type: object
      required: [offerTypes, placements, triggers, payMethods, goals, settings]
      properties:
        goals:
          type: array
          description: цели автопилота — готовые наборы сигналов и мест показа
          items:
            type: object
            required: [id, t, d, signals, placements]
            properties:
              id: { type: string }
              t: { type: string }
              d: { type: string }
              signals: { type: object, additionalProperties: { type: string, enum: [any, and, not] } }
              placements: { type: array, items: { type: string } }
        offerTypes:
          type: array
          items:
            type: object
            required: [id, share, feePct, t, short, cta, d, gets, pay, fit, unit, many, per, payFor, live, wait, fields, via]
            description: 'тексты для кабинета (t, short, cta, d, gets, pay, fit, unit, many, per, payFor, live, wait), поля условий и способ подтверждения'
            properties:
              id: { $ref: '#/components/schemas/OfferType' }
              share: { type: boolean, description: 'true — платит абонент, партнёр получает выплаты' }
              feePct: { type: number }
              t: { type: string, description: название }
              short: { type: string }
              cta: { type: string }
              d: { type: string, description: описание }
              gets: { type: string, description: что получает клиент }
              pay: { type: string, description: за что платит партнёр }
              fit: { type: string, description: кому подходит }
              unit: { type: string, description: результат во множественном числе }
              many: { type: string, description: 'то же в родительном падеже: «заявок»' }
              per: { type: string, description: подпись цены результата }
              payFor: { type: string }
              live: { type: string, description: первое событие после запуска }
              wait: { type: string, description: что ждать в первые дни }
              fields: { type: array, items: { type: object, required: [k, label], properties: { k: { type: string }, label: { type: string }, num: { type: boolean }, suffix: { type: string }, wide: { type: boolean } } } }
              via: { type: object, required: [label, options, hint], properties: { label: { type: string }, options: { type: array, items: { type: string } }, hint: { type: string } } }
            additionalProperties: true
        placements:
          type: array
          items:
            type: object
            required: [id, surface, name, format, pricing, baseCtr, slots, minBidKop, needsConsent]
            properties:
              id: { type: string }
              surface: { type: string }
              name: { type: string }
              format: { type: string }
              pricing: { type: string, enum: [cpc, cpm] }
              baseCtr: { type: [number, 'null'], description: '%' }
              slots: { type: integer }
              minBidKop: { $ref: '#/components/schemas/Kop' }
              needsConsent: { type: boolean }
        triggers:
          type: array
          items:
            type: object
            required: [id, group, name, tier, value, minBidKop, reachHint]
            properties:
              id: { type: string }
              group: { type: string }
              name: { type: string }
              tier: { type: string, enum: [T1, T2, T3, T4] }
              value: { type: string, enum: [hot, week, wide] }
              minBidKop: { $ref: '#/components/schemas/Kop' }
              reachHint: { type: [integer, 'null'] }
        payMethods:
          type: array
          items: { type: object, required: [id, name, hint, largeOnly], properties: { id: { type: string, enum: [sbp, card, invoice, post] }, name: { type: string }, hint: { type: string }, largeOnly: { type: boolean } } }
        settings:
          type: object
          required: [firstBonusKop, wideMarkupPct, minBudgetMonthKop, offerVersion]
          properties:
            firstBonusKop: { $ref: '#/components/schemas/Kop' }
            wideMarkupPct: { type: number }
            minBudgetMonthKop: { $ref: '#/components/schemas/Kop' }
            offerVersion: { type: string }
    CampaignBrief:
      type: object
      required: [id, type, status, name, budgetMonthKop, placements, createdAt, launchedAt]
      properties:
        id: { type: integer }
        type: { $ref: '#/components/schemas/OfferType' }
        status: { $ref: '#/components/schemas/CampaignStatus' }
        name: { type: string }
        budgetMonthKop: { $ref: '#/components/schemas/Kop' }
        placements: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        launchedAt: { type: [string, 'null'], format: date-time }
    Targeting:
      type: object
      properties:
        radiusM: { type: integer, description: 'радиус от активных точек, по умолчанию 1000' }
        signals: { type: object, additionalProperties: { type: string, enum: [any, and, not] }, description: 'сигнал → любой из, и, кроме' }
    Campaign:
      type: object
      required: [id, type, status, name, mode, goal, terms, targeting, placements, wideCard, bidKop, budgetMonthKop, dailyCapKop, payMethod, landingUrl, trackingUrl, startsAt, endsAt, launchedAt, createdAt, updatedAt, version, creative, liveCreative, moderation, approval, payment, deal, forecast]
      properties:
        id: { type: integer }
        type: { $ref: '#/components/schemas/OfferType' }
        status: { $ref: '#/components/schemas/CampaignStatus' }
        name: { type: string }
        mode: { type: string, enum: [auto, manual, plan, special] }
        goal: { type: [string, 'null'] }
        terms: { type: object, additionalProperties: { type: string } }
        targeting: { $ref: '#/components/schemas/Targeting' }
        placements: { type: array, items: { type: string } }
        wideCard: { type: boolean }
        bidKop: { oneOf: [{ $ref: '#/components/schemas/Kop' }, { type: 'null' }], description: 'null — автоставка' }
        budgetMonthKop: { $ref: '#/components/schemas/Kop' }
        dailyCapKop: { oneOf: [{ $ref: '#/components/schemas/Kop' }, { type: 'null' }] }
        payMethod: { type: [string, 'null'], enum: [sbp, card, invoice, post, null] }
        landingUrl: { type: [string, 'null'] }
        trackingUrl: { type: [string, 'null'], description: 'landingUrl с UTM и макросом {click_id}' }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        launchedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
        creative:
          description: последняя версия креатива
          oneOf:
            - type: 'null'
            - type: object
              required: [id, version, adText, imageKey, imageUrl, status, erid]
              properties:
                id: { type: integer }
                version: { type: integer }
                adText: { type: string }
                imageKey: { type: [string, 'null'] }
                imageUrl: { type: [string, 'null'] }
                status: { type: string, enum: [draft, moderation, approved, rejected] }
                erid: { type: [string, 'null'] }
        liveCreative:
          description: какая версия сейчас показывается (одобрена и промаркирована)
          oneOf: [{ type: 'null' }, { type: object, required: [id, version, erid], properties: { id: { type: integer }, version: { type: integer }, erid: { type: string } } }]
        moderation:
          oneOf:
            - type: 'null'
            - type: object
              required: [status, reason, hits]
              properties:
                status: { type: string, enum: [preview, auto, queued, approved, rejected], description: 'preview — черновик, стоп-слова найдены заранее, до отправки' }
                reason: { type: [string, 'null'], description: причина отказа для партнёра }
                hits: { type: array, items: { type: object, required: [word, why, fix], properties: { word: { type: string }, why: { type: string }, fix: { type: string } } } }
        approval:
          oneOf: [{ type: 'null' }, { type: object, required: [expiresAt, requestedBy], properties: { expiresAt: { type: string, format: date-time }, requestedBy: { type: [string, 'null'] } } }]
        payment:
          description: последний платёж под кампанию
          oneOf:
            - type: 'null'
            - type: object
              required: [id, status, method, amountKop, confirmUrl]
              properties: { id: { type: string }, status: { type: string }, method: { type: string }, amountKop: { $ref: '#/components/schemas/Kop' }, confirmUrl: { type: [string, 'null'] } }
        deal:
          type: object
          required: [line, offer, cta]
          properties: { line: { type: string }, offer: { type: string }, cta: { type: string } }
        forecast:
          type: object
          description: 'оценка на месяц по каталогу и гео; точнее станет с подключением DMP'
          required: [reach, impressions, clicks, cpcKop, results, perKop, spendKop]
          properties:
            reach: { type: integer }
            impressions: { type: integer }
            clicks: { type: integer }
            cpcKop: { $ref: '#/components/schemas/Kop' }
            results: { type: integer }
            perKop: { $ref: '#/components/schemas/Kop', description: 'цена результата или выплата за купон и подписку' }
            spendKop: { $ref: '#/components/schemas/Kop' }
    CampaignPatch:
      type: object
      properties:
        version: { type: integer }
        name: { type: string }
        mode: { type: string, enum: [auto, manual, plan, special] }
        goal: { type: string }
        terms: { type: object, additionalProperties: { type: string } }
        targeting: { $ref: '#/components/schemas/Targeting' }
        placements: { type: array, minItems: 1, items: { type: string } }
        wideCard: { type: boolean }
        bidKop: { type: [string, integer, 'null'], description: 'не ниже минимальной ставки выбранных мест; null — автоставка' }
        budgetMonthKop: { type: [string, integer], description: не меньше settings.minBudgetMonthKop }
        dailyCapKop: { type: [string, integer, 'null'] }
        payMethod: { type: string, enum: [sbp, card, invoice, post] }
        landingUrl: { type: string, format: uri }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        adText: { type: string, minLength: 1, maxLength: 90 }
        imageKey: { type: [string, 'null'] }
        paused: { type: boolean }
    LaunchRequest:
      type: object
      properties:
        acceptOffer: { type: boolean, description: 'принять действующую оферту, если ещё не принята' }
        payMethod: { type: string, enum: [sbp, card, invoice, post] }
        idempotencyKey: { type: string, description: 'обязателен, если нужно доплатить' }
    LaunchResult:
      type: object
      required: [campaign, payment, approvalUrl]
      properties:
        campaign: { $ref: '#/components/schemas/Campaign' }
        payment:
          description: 'платёж на недостающее; null — денег хватает или они не нужны'
          oneOf:
            - type: 'null'
            - type: object
              required: [payment, confirmUrl, invoice]
              properties:
                payment: { $ref: '#/components/schemas/Payment' }
                confirmUrl: { type: [string, 'null'] }
                invoice: { oneOf: [{ $ref: '#/components/schemas/Invoice' }, { type: 'null' }] }
        approvalUrl: { type: [string, 'null'], description: 'ссылка руководителю, если отправил не подписант' }

    Document:
      type: object
      required: [id, kind, title, number, period, amountKop, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [offer, invoice, act, sf, agent_report, contract] }
        title: { type: string }
        number: { type: [string, 'null'] }
        period: { type: [string, 'null'], format: date, description: первое число месяца }
        amountKop: { oneOf: [{ $ref: '#/components/schemas/Kop' }, { type: 'null' }] }
        status: { type: string, enum: [draft, issued, sent, delivered, signed, rejected] }
        createdAt: { type: string, format: date-time }

    ConversionStatus: { type: string, enum: [pending, approved, rejected, returned], description: 'ждёт, засчитана, отклонена, возврат' }
    Conversion:
      type: object
      required: [id, campaignId, campaignName, clickId, orderId, kind, amountKop, costKop, status, source, note, disputeUntil, createdAt]
      properties:
        id: { type: integer }
        campaignId: { type: integer }
        campaignName: { type: string }
        clickId: { type: [string, 'null'] }
        orderId: { type: [string, 'null'] }
        kind: { type: string, enum: [lead, order, redeem, renewal], description: 'заявка, заказ, купон, подписка' }
        amountKop: { oneOf: [{ $ref: '#/components/schemas/Kop' }, { type: 'null' }], description: сумма заказа или платежа }
        costKop: { $ref: '#/components/schemas/Kop', description: 'списано с партнёра или начислено ему' }
        status: { $ref: '#/components/schemas/ConversionStatus' }
        source: { type: string, enum: [postback, csv, cabinet, form, billing, pos] }
        note: { type: [string, 'null'] }
        disputeUntil: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    Stats:
      type: object
      required: [from, to, totals, daily, hourly, placements]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        totals:
          type: object
          required: [impressions, reach, clicks, billableClicks, ctr, spendKop, payoutKop, results]
          properties:
            impressions: { type: integer }
            reach: { type: integer, description: разных абонентов }
            clicks: { type: integer }
            billableClicks: { type: integer }
            ctr: { type: number, description: '%' }
            spendKop: { $ref: '#/components/schemas/Kop' }
            payoutKop: { $ref: '#/components/schemas/Kop' }
            results:
              type: object
              required: [pending, approved, rejected, returned]
              properties: { pending: { type: integer }, approved: { type: integer }, rejected: { type: integer }, returned: { type: integer } }
        daily:
          type: array
          items: { type: object, required: [day, impressions, clicks, conversions], properties: { day: { type: string, format: date-time }, impressions: { type: integer }, clicks: { type: integer }, conversions: { type: integer } } }
        hourly:
          type: array
          description: последние 48 часов
          items: { type: object, required: [hour, impressions, clicks], properties: { hour: { type: string, format: date-time }, impressions: { type: integer }, clicks: { type: integer } } }
        placements:
          type: array
          items:
            type: object
            required: [placement, name, impressions, clicks, ctr, spendKop]
            properties: { placement: { type: string }, name: { type: string }, impressions: { type: integer }, clicks: { type: integer }, ctr: { type: number }, spendKop: { $ref: '#/components/schemas/Kop' } }

security:
  - session: []
