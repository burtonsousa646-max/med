syntax = "proto3";

package grpc.health.v1;

// Совместимый unary-контракт стандартного gRPC healthcheck.
// Источник: https://github.com/grpc/grpc-proto/blob/master/grpc/health/v1/health.proto
// На первом этапе используется Check; потоковый Watch не предоставляется.
service Health {
  // Пустое имя — состояние сервера; неизвестное имя — NOT_FOUND.
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}
