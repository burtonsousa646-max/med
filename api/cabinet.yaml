openapi: 3.1.0
info:
  title: Рекламная платформа билайна — API кабинета партнёра
  version: 0.2.0
  description: |
    Контракт кабинета партнёра и входа. Источник правды для интерфейса и сервера:
    тест server/contract.test.ts проверяет, что каждый маршрут сервера описан здесь и наоборот.

    Авторизация — cookie `sid` (httpOnly), её ставит вход. Компания и роль берутся из сессии,
    в запросах их не передают. Сменить компанию — POST /auth/company.

    Операции прототипа (prototype-app/api/openapi.yaml) переносятся сюда по мере реализации модулей,
    без демо-полей (`Session.clock`, cookie `demo`). Деньги в ответах — копейки, поля с суффиксом `Kop`.
servers:
  - url: /api
tags:
  - { name: деньги }
  - { name: вход }
  - { name: компания }
  - { name: участники }

paths:
  /auth/providers:
    get:
      tags: [вход]
      summary: Способы входа партнёра
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Provider' } }

  /auth/start:
    post:
      tags: [вход]
      summary: Начать вход через бизнес-ID
      description: Ставит cookie `oauth_state` на 10 минут и возвращает адрес страницы провайдера.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties: { provider: { $ref: '#/components/schemas/ProviderId' } }
      responses:
        '200':
          description: адрес провайдера
          content:
            application/json:
              schema: { type: object, required: [url], properties: { url: { type: string } } }
        '422': { $ref: '#/components/responses/Error' }

  /auth/callback/{provider}:
    get:
      tags: [вход]
      summary: Возврат от провайдера
      description: |
        Меняет code на данные человека. Если провайдер подтвердил полномочия в организации,
        компания создаётся по ИНН, человек становится владельцем и подписантом. Ставит cookie `sid`
        и перенаправляет в кабинет (`APP_URL/cabinet`).
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { $ref: '#/components/schemas/ProviderId' } }
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: в кабинет }
        '422': { $ref: '#/components/responses/Error' }

  /auth/email/start:
    post:
      tags: [вход]
      summary: Отправить код входа на почту
      description: Код из 6 цифр, живёт 10 минут, повторно — не раньше чем через минуту.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/email/verify:
    post:
      tags: [вход]
      summary: Войти по коду
      description: Пять неверных попыток — код сгорает. Ставит cookie `sid`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties: { email: { type: string, format: email }, code: { type: string, pattern: '^\d{6}$' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/Error' }

  /auth/me:
    get:
      tags: [вход]
      summary: Кто вошёл
      responses:
        '200':
          description: партнёр или сотрудник
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MePartner'
                  - $ref: '#/components/schemas/MeStaff'
        '401': { $ref: '#/components/responses/Error' }

  /auth/company:
    post:
      tags: [вход]
      summary: Выбрать компанию
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [companyId], properties: { companyId: { type: string, format: uuid } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [вход]
      summary: Выйти
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /auth/companies:
    post:
      tags: [компания]
      summary: Добавить компанию по ИНН
      description: |
        Для вошедших по почте. Человек становится владельцем без права подписи: оферту и оплату подтвердит
        руководитель, войдя через бизнес-ID. Компания выбирается в сессии, проверка юрлица ставится в очередь.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [inn], properties: { inn: { type: string, pattern: '^\d{10}(\d{2})?$' } } }
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /auth/invitations/{token}/accept:
    post:
      tags: [участники]
      summary: Принять приглашение в компанию
      description: Токен — из ссылки в письме, одноразовый, живёт 7 дней. Компания выбирается в сессии.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: object, required: [ok, companyId], properties: { ok: { const: true }, companyId: { type: string, format: uuid } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /cabinet/company:
    get:
      tags: [компания]
      summary: Текущая компания целиком
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [компания]
      summary: Изменить компанию
      description: Только владелец. Смена реквизитов обновляет контрагента в учётной системе билайна (через очередь).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyPatch' }
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/company/points:
    post:
      tags: [компания]
      summary: Добавить точку продаж
      description: Владелец или сотрудник. Адрес проходит геокодер; не найден — 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [addr], properties: { addr: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/company/points/{pointId}:
    patch:
      tags: [компания]
      summary: Включить или выключить точку в рекламе
      description: Хотя бы одна точка остаётся в рекламе, иначе 422.
      parameters:
        - { name: pointId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [active], properties: { active: { type: boolean } } }
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/company/invitations:
    post:
      tags: [участники]
      summary: Пригласить сотрудника или бухгалтера
      description: Только владелец. Письмо со ссылкой `APP_URL/invite/<token>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties: { email: { type: string, format: email }, role: { type: string, enum: [staff, accountant] } }
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/company/members/{userId}:
    delete:
      tags: [участники]
      summary: Удалить участника
      description: Только владелец, не себя. Сессии участника в этой компании закрываются.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/company/consents:
    post:
      tags: [компания]
      summary: Дать согласие
      description: 'company — обработка данных компании, signer — данных подписанта, profile — использование профиля для подбора аудитории.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [kind], properties: { kind: { type: string, enum: [company, signer, profile] } } }
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/company/consents/{kind}:
    delete:
      tags: [компания]
      summary: Отозвать согласие
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [company, signer, profile] } }
      responses:
        '200': { $ref: '#/components/responses/Company' }

  /cabinet/company/offer:
    post:
      tags: [компания]
      summary: Принять текущую оферту
      description: Только подписант. Повторное принятие той же версии ничего не меняет. Документ «оферта» появляется в документах.
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '403': { $ref: '#/components/responses/Error' }

  /cabinet/company/edo:
    post:
      tags: [компания]
      summary: Подключить ЭДО
      description: Владелец или бухгалтер. Приглашение уходит оператору ЭДО через очередь.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [operator], properties: { operator: { type: string, examples: [Диадок, СБИС] } } }
      responses:
        '200': { $ref: '#/components/responses/Company' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }


  /cabinet/balance:
    get:
      tags: [деньги]
      summary: Баланс, операции, неоплаченные счета
      description: |
        Суммы — строки с целым числом копеек (bigint не теряет точность в JSON).
        availableKop = mainKop + bonusKop — сколько можно потратить. Списания идут сначала с бонусов.
        payoutKop — накопленные выплаты за купоны и подписки. operations — последние 100, сумма со знаком.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }

  /cabinet/payments:
    post:
      tags: [деньги]
      summary: Пополнить баланс
      description: |
        Владелец или бухгалтер, компания проверена. sbp и card — возвращают confirmUrl страницы оплаты,
        деньги зачисляются по вебхуку шлюза. invoice — выставляет счёт-оферту (номер РП-ГГГГ-NNNNNN),
        зачисление по выписке банка. Первая успешная оплата даёт бонус. Повтор с тем же idempotencyKey возвращает тот же платёж.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountKop, method, idempotencyKey]
              properties:
                amountKop: { type: [string, integer], description: 'копейки, не меньше settings.min_topup_kop' }
                method: { type: string, enum: [sbp, card, invoice] }
                campaignId: { type: integer, description: 'оплата под кампанию: после зачисления кампания уходит на проверку' }
                idempotencyKey: { type: string }
      responses:
        '200':
          description: платёж создан
          content:
            application/json:
              schema:
                type: object
                required: [payment, confirmUrl, invoice]
                properties:
                  payment: { $ref: '#/components/schemas/Payment' }
                  confirmUrl: { type: [string, 'null'], description: 'куда отправить человека для оплаты (sbp, card)' }
                  invoice: { oneOf: [{ $ref: '#/components/schemas/Invoice' }, { type: 'null' }] }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /cabinet/payments/{id}:
    get:
      tags: [деньги]
      summary: Статус платежа
      description: Для экрана возврата со страницы оплаты.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: sid }

  responses:
    Ok:
      description: ok
      content:
        application/json:
          schema: { type: object, required: [ok], properties: { ok: { const: true } } }
    Error:
      description: ошибка
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Company:
      description: компания целиком
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Company' }

  schemas:
    Error:
      type: object
      required: [message]
      properties: { message: { type: string, description: текст для человека } }

    ProviderId: { type: string, enum: [gos, sber, alfa, b2b], description: 'Госуслуги, СберБизнес ID, Альфа ID для бизнеса, ЛК билайн бизнес' }
    Provider:
      type: object
      required: [id, name]
      properties: { id: { $ref: '#/components/schemas/ProviderId' }, name: { type: string } }

    PartnerRole: { type: string, enum: [owner, staff, accountant, agency], description: 'владелец, сотрудник, бухгалтер, агентство' }
    MePartner:
      type: object
      required: [kind, user, companyId, companies]
      properties:
        kind: { const: partner }
        user:
          type: object
          required: [id, name, email, phone]
          properties: { id: { type: string, format: uuid }, name: { type: string }, email: { type: [string, 'null'] }, phone: { type: [string, 'null'] } }
        companyId: { type: [string, 'null'], format: uuid, description: 'выбранная компания; null — компании ещё нет' }
        companies:
          type: array
          items:
            type: object
            required: [id, name, inn, role, signer]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              inn: { type: string }
              role: { $ref: '#/components/schemas/PartnerRole' }
              signer: { type: boolean, description: может принимать оферту и подтверждать оплату }
    MeStaff:
      type: object
      required: [kind, staff]
      properties:
        kind: { const: staff }
        staff:
          type: object
          required: [id, email, name, roles]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            name: { type: string }
            roles: { type: array, items: { type: string, enum: [moderator, manager, finance, admin] } }

    Company:
      type: object
      required: [id, inn, kpp, ogrn, name, brand, segment, kycStatus, kycReason, address, bank, site, phone, notify, edoOperator, autoTopup, offerVersion, offerAcceptedAt, currentOfferVersion, points, members, invitations, consents]
      properties:
        id: { type: string, format: uuid }
        inn: { type: string }
        kpp: { type: [string, 'null'] }
        ogrn: { type: [string, 'null'] }
        name: { type: string, description: 'полное название; после проверки — из ЕГРЮЛ' }
        brand: { type: string, description: как компанию видят абоненты }
        segment: { type: string, enum: [small, medium, large], description: 'задаёт режим сборки: автопилот, ручная настройка, медиаплан' }
        kycStatus: { type: string, enum: [pending, verified, rejected, blocked], description: 'проверка юрлица; запуск кампаний — только verified' }
        kycReason: { type: [string, 'null'], description: почему не проверено }
        address: { type: [string, 'null'], description: юридический адрес из реестра }
        bank:
          oneOf:
            - type: 'null'
            - { type: object, required: [bik, account, bank], properties: { bik: { type: string }, account: { type: string }, bank: { type: string } } }
        site: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        notify: { $ref: '#/components/schemas/Notify' }
        edoOperator: { type: [string, 'null'] }
        autoTopup: { type: boolean }
        offerVersion: { type: [string, 'null'], description: принятая версия оферты }
        offerAcceptedAt: { type: [string, 'null'], format: date-time }
        currentOfferVersion: { type: string, description: 'действующая версия; не совпадает с offerVersion — оферту нужно принять заново' }
        points: { type: array, items: { $ref: '#/components/schemas/Point' } }
        members:
          type: array
          items:
            type: object
            required: [id, name, email, role, title, signer]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              email: { type: [string, 'null'] }
              role: { $ref: '#/components/schemas/PartnerRole' }
              title: { type: string }
              signer: { type: boolean }
        invitations:
          type: array
          items:
            type: object
            required: [id, target, role, expiresAt]
            properties: { id: { type: string, format: uuid }, target: { type: string }, role: { type: string }, expiresAt: { type: string, format: date-time } }
        consents:
          type: array
          items:
            type: object
            required: [kind, version, grantedAt]
            properties: { kind: { type: string }, version: { type: string }, grantedAt: { type: string, format: date-time } }
    Point:
      type: object
      required: [id, addr, normalized, lat, lon, active]
      properties:
        id: { type: integer }
        addr: { type: string, description: как ввёл партнёр }
        normalized: { type: [string, 'null'], description: как понял геокодер }
        lat: { type: number }
        lon: { type: number }
        active: { type: boolean, description: в рекламе }
    Notify:
      type: object
      required: [sms, mail, tg]
      properties: { sms: { type: boolean }, mail: { type: boolean }, tg: { type: boolean } }
    CompanyPatch:
      type: object
      properties:
        brand: { type: string }
        segment: { type: string, enum: [small, medium, large] }
        site: { type: string }
        phone: { type: string }
        notify: { $ref: '#/components/schemas/Notify' }
        autoTopup: { type: boolean }
        bank:
          type: object
          required: [bik, account]
          properties: { bik: { type: string, pattern: '^\d{9}$' }, account: { type: string, description: 20 цифр, пробелы допустимы }, bank: { type: string } }

    Kop: { type: string, pattern: '^-?\d+$', description: целое число копеек строкой }
    Payment:
      type: object
      required: [id, method, amountKop, status, campaignId, createdAt]
      properties:
        id: { type: string, format: uuid }
        method: { type: string, enum: [sbp, card, invoice, post] }
        amountKop: { $ref: '#/components/schemas/Kop' }
        status: { type: string, enum: [created, pending, succeeded, failed, refunded] }
        campaignId: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
    Invoice:
      type: object
      required: [id, number, amountKop, status, dueAt, issuedAt, paidAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, examples: [РП-2026-000001] }
        amountKop: { $ref: '#/components/schemas/Kop' }
        status: { type: string, enum: [issued, paid, cancelled] }
        dueAt: { type: [string, 'null'], format: date-time }
        issuedAt: { type: string, format: date-time }
        paidAt: { type: [string, 'null'], format: date-time }
    Balance:
      type: object
      required: [mainKop, bonusKop, payoutKop, availableKop, operations, invoices]
      properties:
        mainKop: { $ref: '#/components/schemas/Kop' }
        bonusKop: { $ref: '#/components/schemas/Kop' }
        payoutKop: { $ref: '#/components/schemas/Kop' }
        availableKop: { $ref: '#/components/schemas/Kop' }
        operations:
          type: array
          items:
            type: object
            required: [id, kind, memo, campaignId, amountKop, createdAt]
            properties:
              id: { type: integer }
              kind: { type: string, enum: [topup, charge, bonus, payout, refund, adjustment, commission] }
              memo: { type: string }
              campaignId: { type: [integer, 'null'] }
              amountKop: { $ref: '#/components/schemas/Kop' }
              createdAt: { type: string, format: date-time }
        invoices: { type: array, items: { $ref: '#/components/schemas/Invoice' } }

security:
  - session: []
