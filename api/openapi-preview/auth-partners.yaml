openapi: 3.1.0
info:
  title: Вход и партнёры
  version: 1.0.0
  description: Операции для включения в единый API при подключении обработчиков фич 005 и 006.
servers:
  - url: /api
tags:
  - name: auth
  - name: partners
paths:
  /v1/auth/email:
    post:
      operationId: authenticateByEmail
      summary: Запросить письмо или войти по коду
      description: Тело только с email запрашивает отправку письма. Тело с email и code проверяет код.
      tags:
        - auth
      security: []
      responses:
        '202':
          description: Отправка принята.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: При первом запросе устанавливается защищённая cookie посетителя.
              schema:
                type: string
        '204':
          description: Сессия открыта.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description:
                Два отдельных заголовка устанавливают access_token и refresh_token с HttpOnly,
                Secure и SameSite=Lax.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '429':
          $ref: '#/components/responses/Limited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/EmailCodeRequest'
                - $ref: '#/components/schemas/EmailCodeVerification'
  /v1/auth/sessions:
    delete:
      operationId: endSession
      summary: Выйти из текущей сессии
      tags:
        - auth
      security:
        - Refresh: []
      responses:
        '204':
          description: Сессия завершена.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: Обе cookie удаляются отдельными заголовками с исходными путями.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sessions/refresh:
    post:
      operationId: refreshSession
      summary: Обновить токен доступа
      tags:
        - auth
      security:
        - Refresh: []
      responses:
        '204':
          description: Сессия подтверждена.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: Обновлённая cookie access_token.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/partners/profile:
    get:
      operationId: getOwnPartnerProfile
      summary: Получить свой профиль и организацию
      tags:
        - partners
      security:
        - Access: []
      responses:
        '200':
          description: Текущий профиль.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/partners/invitations/{invitationId}:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createPartnerInvitation
      summary: Пригласить коллегу в свою организацию
      description: Клиент создаёт UUID для нового приглашения и повторяет тот же UUID при транспортном повторе. При успешном создании invitationId в ответе совпадает с UUID в пути.
      tags:
        - partners
      security:
        - Access: []
      responses:
        '201':
          description: Создано приглашение для адресата.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
    patch:
      operationId: acceptPartnerInvitation
      summary: Принять приглашение
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  const: accepted
      tags:
        - partners
      security:
        - Access: []
      responses:
        '204':
          description: Членство подтверждено.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: revokePartnerInvitation
      summary: Отозвать своё приглашение
      tags:
        - partners
      security:
        - Access: []
      responses:
        '204':
          description: Приглашение отозвано.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    Access:
      type: apiKey
      in: cookie
      name: access_token
    Refresh:
      type: apiKey
      in: cookie
      name: refresh_token
  schemas:
    EmailCodeRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    EmailCodeVerification:
      type: object
      additionalProperties: false
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: ^[0-9]{6}$
    Organization:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - inn
      properties:
        organizationId:
          type: string
          format: uuid
        inn:
          type: string
          pattern: ^[0-9]{10}([0-9]{2})?$
        customerName:
          type: string
    UserProfile:
      type: object
      additionalProperties: false
      required:
        - userId
        - canInvite
      properties:
        userId:
          type: string
          format: uuid
        contactEmail:
          type: string
          format: email
        phone:
          type: string
        organization:
          $ref: '#/components/schemas/Organization'
        canInvite:
          type: boolean
    InvitationRequest:
      type: object
      additionalProperties: false
      required:
        - recipientEmail
      properties:
        recipientEmail:
          type: string
          format: email
    Invitation:
      type: object
      additionalProperties: false
      required:
        - invitationId
        - expiresAt
      properties:
        invitationId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    InvalidRequest:
      description: Ошибка параметров или тела запроса.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Неверный код или недействительная сессия. Код access_expired допускает тихое обновление.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Действие запрещено или источник запроса не прошёл проверку.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс отсутствует или недоступен пользователю.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Конфликт состояния приглашения, членства или повтор ключа с другими данными.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: Тело запроса слишком велико.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unsupported:
      description: Неподдерживаемый тип тела запроса.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Limited:
      description: Превышено ограничение частоты или числа попыток.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: Внутренняя ошибка.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Временная недоступность зависимости или истечение дедлайна.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
