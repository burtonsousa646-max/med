# Генерация кода из api/proto/ для NestJS — в пакет @platform/contracts.
#
# В режиме NestJS ts-proto генерирует только интерфейсы сообщений, клиентов и контроллеров.
# Сериализацию во время работы выполняет @grpc/proto-loader по самим .proto-файлам, поэтому
# типы должны совпадать с тем, что отдаёт proto-loader с опциями PROTO_LOADER_OPTIONS из @platform/contracts:
#   int64  → string  (proto-loader не умеет bigint): forceLong=string  ↔ longs: String
#   enum   → string                                : stringEnums=true  ↔ enums: String
#   Timestamp → { seconds, nanos }                 : useDate=false
version: v2
clean: true
plugins:
  - local: node_modules/.bin/protoc-gen-ts_proto
    out: ../server/shared/contracts/src/generated
    opt:
      - nestJs=true
      - importSuffix=.js
      - esModuleInterop=true
      - useDate=false
      - forceLong=string
      - stringEnums=true
