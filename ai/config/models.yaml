# Уровень модели роли (поле tier в ai/agents/*.md) → модель в каждом инструменте.
#
#   reasoning — сложные рассуждения: требования, архитектура
#   standard  — основная работа: код, тесты
#   fast      — простые и массовые задачи
#
# Claude Code — генератор адаптеров записывает модель в команду роли (поле model),
#   поэтому роль запускается на нужной модели автоматически. После изменения — pnpm ai:adapters.
# Codex, Kimi Code, Gemini CLI — навыки и команды этих инструментов не умеют задавать модель.
#   Значения ниже — подсказка человеку, какую модель выбрать в инструменте перед вызовом роли.
#   Пустое значение — модель по умолчанию в инструменте.
#
# Формат: только два уровня вложенности, значения — строки без кавычек.

claude-code:
  reasoning: opus
  standard: sonnet
  fast: haiku

codex:
  reasoning:
  standard:
  fast:

kimi-code:
  reasoning:
  standard:
  fast:

gemini-cli:
  reasoning:
  standard:
  fast:
