name: med-prototype

services:
  api:
    image: med-prototype-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: prototype-app/Dockerfile
      target: api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '8787'
      DB_PATH: /data/demo.sqlite
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CAMPAIGN_SMTP_URL: ${CAMPAIGN_SMTP_URL:-}
      CAMPAIGN_MAIL_FROM: ${CAMPAIGN_MAIL_FROM:-}
      NEAR_AI_MODEL: ${NEAR_AI_MODEL:-claude-opus-5-5}
    volumes:
      - api-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  autocomplete:
    image: med-prototype-api:${IMAGE_TAG:-local}
    pull_policy: never
    command: ["node", "server/autocomplete.ts"]
    environment:
      AUTOCOMPLETE_HOST: 0.0.0.0
      AUTOCOMPLETE_PORT: '8787'
      DADATA_API_KEY: ${DADATA_API_KEY:-}
      DADATA_SECRET_KEY: ${DADATA_SECRET_KEY:-}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    image: med-prototype-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: prototype-app/Dockerfile
      target: web
      args:
        VITE_METRIKA_ID: ${VITE_METRIKA_ID:-}
    environment:
      SITE_ADDRESS: :8080
    ports:
      - 127.0.0.1:${HTTP_PORT:-8080}:8080
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      autocomplete:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  api-data:
  caddy-data:
  caddy-config:
