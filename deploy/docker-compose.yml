# Локальное окружение платформы: PostgreSQL, Redis, Unleash.
# Запуск из корня: cp deploy/.env.example deploy/.env && pnpm env:up
# Стек наблюдаемости добавляется после подтверждения раздела в specs/architecture/tech-stack.md.
name: platform

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      POSTGRES_DB: ${POSTGRES_USER:-platform}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Suggestion — два отдельных экземпляра с разными ролями отказа (ADR 0004).
  # Состояние кратковременное; AOF/RDB, дисковые тома и резервные копии запрещены.
  suggestion-rate-redis:
    image: redis:8-alpine
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:${SUGGESTION_RATE_REDIS_PORT:-6380}:6379'
    mem_limit: 128m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  suggestion-cache-redis:
    image: redis:8-alpine
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    ports:
      - '127.0.0.1:${SUGGESTION_CACHE_REDIS_PORT:-6381}:6379'
    mem_limit: 256m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Feature toggles — specs/architecture/adr/0001-feature-toggles.md.
  # Админка: http://localhost:4242, вход admin / unleash4all — только для локального окружения.
  # Токены создаются при первом старте; флаги заводит pnpm env:flags из deploy/unleash/flags.json.
  unleash:
    image: unleashorg/unleash-server:8
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/unleash
      DATABASE_SSL: 'false'
      LOG_LEVEL: warn
      INIT_ADMIN_API_TOKENS: ${UNLEASH_ADMIN_TOKEN:-*:*.local-admin-token}
      INIT_BACKEND_API_TOKENS: ${UNLEASH_API_TOKEN:-default:development.local-backend-token}
    ports:
      - '${UNLEASH_PORT:-4242}:4242'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4242/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  api-gateway:
    profiles: [gateway]
    build:
      context: ..
      dockerfile: server/apps/api-gateway/Dockerfile
    environment:
      NODE_ENV: development
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: '3000'
      GRPC_HEALTH_HOST: 0.0.0.0
      GRPC_HEALTH_PORT: '50050'
      APP_VERSION: ${APP_VERSION:-0.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS:-10000}
      GRPC_CALL_TIMEOUT_MS: ${GRPC_CALL_TIMEOUT_MS:-3000}
      HTTP_BODY_LIMIT_BYTES: ${HTTP_BODY_LIMIT_BYTES:-1048576}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-15000}
      UNLEASH_URL: http://unleash:4242/api
      UNLEASH_API_TOKEN: ${UNLEASH_API_TOKEN:-default:development.local-backend-token}
      # Адреса внутри сети Compose отличаются от адресов процессов на хосте.
      SUGGESTION_GRPC_TARGET: suggestion-service:50051
      SUGGESTION_RATE_REDIS_URL: redis://suggestion-rate-redis:6379
      SUGGESTION_RATE_HMAC_SECRET: ${SUGGESTION_RATE_HMAC_SECRET:-}
      SUGGESTION_SCOPE: ${SUGGESTION_SCOPE:-local}
      SUGGESTION_RATE_LIMIT_RPS: ${SUGGESTION_RATE_LIMIT_RPS:-5}
      SUGGESTION_REDIS_TIMEOUT_MS: ${SUGGESTION_REDIS_TIMEOUT_MS:-100}
      GATEWAY_TRUSTED_PROXY_CIDRS: ${GATEWAY_TRUSTED_PROXY_CIDRS:-}
    ports:
      - '${GATEWAY_HTTP_PORT:-3000}:3000'
    depends_on:
      unleash:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
