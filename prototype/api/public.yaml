openapi: 3.1.0
info:
  title: Рекламная платформа билайна — публичный API
  version: 0.2.0
  description: |
    Для систем снаружи кабинета: поверхности билайна (запрос рекламы, маяки показа и клика — день 3),
    сервер партнёра (постбэк — день 3), внешние системы билайна (вебхуки).

    Вебхуки. Каждая система подписывает тело запроса HMAC-SHA256 своим секретом (`HOOK_SECRET_<СИСТЕМА>`)
    и передаёт уникальный ID события. Повтор того же ID безопасен: ответ `duplicate: true`, обработки нет.
    Ошибка обработчика — 500, событие нужно прислать снова.
servers:
  - url: /api
tags:
  - { name: показ }
  - { name: результаты }
  - { name: служебное }
  - { name: вебхуки }

paths:
  /health:
    get:
      tags: [служебное]
      summary: Жив ли сервис и какие адаптеры подключены
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [ok, ports]
                properties:
                  ok: { const: true }
                  ports:
                    type: array
                    items: { type: object, required: [port, adapter], properties: { port: { type: string }, adapter: { type: string } } }

  /hooks/{system}/{event}:
    post:
      tags: [вебхуки]
      summary: Событие от внешней системы
      description: |
        Какие события принимает каждая система — docs/integrations.md.
        Примеры: payments/payment.succeeded, edo/document.status, pos/coupon.redeemed.
      parameters:
        - { name: system, in: path, required: true, schema: { type: string } }
        - { name: event, in: path, required: true, schema: { type: string } }
        - { name: X-Event-Id, in: header, required: true, schema: { type: string }, description: уникальный ID события у отправителя }
        - { name: X-Signature, in: header, required: true, schema: { type: string, pattern: '^sha256=[0-9a-f]{64}$' }, description: HMAC-SHA256 тела в hex }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: принято
          content:
            application/json:
              schema: { type: object, required: [ok, duplicate], properties: { ok: { const: true }, duplicate: { type: boolean } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /stub/idp:
    get:
      tags: [служебное]
      summary: Страница заглушки бизнес-ID
      description: Только вне production (или с ALLOW_STUB_LOGIN=1). Исчезает из использования, когда idp подключён к провайдерам.
      responses: { '200': { description: HTML-форма } }
    post:
      tags: [служебное]
      summary: Отправка формы заглушки бизнес-ID
      responses: { '302': { description: на колбэк входа } }
  /stub/sso:
    get:
      tags: [служебное]
      summary: Страница заглушки SSO сотрудников
      responses: { '200': { description: HTML-форма } }
    post:
      tags: [служебное]
      summary: Отправка формы заглушки SSO
      responses: { '302': { description: на колбэк входа } }


  /stub/pay/{id}:
    get:
      tags: [служебное]
      summary: Страница заглушки платёжного шлюза
      description: Только при INT_PAYMENTS=stub и вне production (или ALLOW_STUB_LOGIN=1).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: HTML-страница оплаты } }
    post:
      tags: [служебное]
      summary: Оплатить или отказать на заглушке
      description: 'result=ok — событие payments/payment.succeeded, иначе payment.failed; затем возврат в кабинет.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '302': { description: в кабинет, на экран баланса } }


  /files/{key}:
    get:
      tags: [служебное]
      summary: Файл креатива
      description: Только ключи creatives/… — их показывают абонентам. Кэшируется навсегда (ключ меняется при каждой загрузке).
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: картинка }
        '404': { $ref: '#/components/responses/Error' }


  /public/serve:
    post:
      tags: [показ]
      summary: Запросить рекламу на место показа
      description: |
        Для поверхностей билайна (приложение, сайт, магазин, ЛК B2B). Отбор живых кампаний на это место, фильтры
        (расписание, деньги, гео — если переданы координаты, частота — не больше 3 показов кампании абоненту за 7 дней,
        сигналы — если передан MED-ID, согласие на рекламу), скор «ставка × pCTR», аукцион второй цены, одна реклама от компании.
        Показ не засчитывается, пока поверхность не вызовет impressionUrl — когда карточка реально видна.
        Заголовок X-Surface-Key обязателен, если на сервере задан SURFACE_KEYS.
      parameters:
        - { name: X-Surface-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placement]
              properties:
                placement: { type: string, examples: [showcase, main, paid] }
                medId: { type: string, maxLength: 64, description: 'обезличенный ID абонента (MED-ID) или ID устройства; без него — показ по контексту' }
                lat: { type: number }
                lon: { type: number }
                limit: { type: integer, minimum: 1, description: 'не больше мест в слоте' }
      responses:
        '200':
          description: победители аукциона, лучшие первыми
          content:
            application/json:
              schema:
                type: object
                required: [ads]
                properties:
                  ads:
                    type: array
                    items:
                      type: object
                      required: [token, campaignId, type, wide, creative, impressionUrl, clickUrl]
                      properties:
                        token: { type: string, description: подписанный токен показа, живёт 24 часа }
                        campaignId: { type: integer }
                        type: { type: string, enum: [click, coupon, lead, promo, sub] }
                        wide: { type: boolean, description: широкая карточка в витрине }
                        creative:
                          type: object
                          required: [text, imageUrl, erid, brand, offer, cta, line]
                          properties:
                            text: { type: string }
                            imageUrl: { type: [string, 'null'] }
                            erid: { type: string, description: маркировка — показывать на креативе обязательно }
                            brand: { type: string }
                            offer: { type: string }
                            cta: { type: string }
                            line: { type: string }
                        impressionUrl: { type: string, description: POST — карточка видна }
                        clickUrl: { type: string, description: 'GET — клик; редирект на сайт партнёра с click_id, ?format=json — для приложения' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /public/i/{token}:
    post:
      tags: [показ]
      summary: Маяк показа
      description: Повтор того же показа не пишется.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: записан }
        '404': { $ref: '#/components/responses/Error' }

  /public/c/{token}:
    get:
      tags: [показ]
      summary: Клик
      description: |
        Создаёт click_id и записывает клик. Оплачивается только у «перехода» и только если: не быстрее 0,5 с после выдачи рекламы,
        не повтор того же абонента по той же кампании за 24 часа, антифрод не считает клик ботом.
        Редирект на сайт партнёра с utm-метками и click_id; у купона и подписки сайта нет — ответ JSON.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json] } }
      responses:
        '200':
          description: '?format=json или нет сайта'
          content:
            application/json:
              schema: { type: object, required: [clickId, url], properties: { clickId: { type: string }, url: { type: [string, 'null'] } } }
        '302': { description: на сайт партнёра }
        '404': { $ref: '#/components/responses/Error' }

  /public/act/{clickId}:
    post:
      tags: [показ]
      summary: Действие в приложении после клика
      description: |
        Заявка — форма с именем и телефоном, результат «ждёт», контакты уходят партнёру.
        Купон и подписка — оплата со счёта телефона абонента (порт subscriberBilling), результат засчитан сразу.
        Клик действует 24 часа.
      parameters:
        - { name: clickId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, phone: { type: string, description: обязателен для заявки } } }
      responses:
        '200':
          description: результат записан
          content:
            application/json:
              schema: { type: object, required: [ok, conversionId], properties: { ok: { const: true }, conversionId: { type: integer } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /public/postback:
    get:
      tags: [результаты]
      summary: Результат с сервера партнёра
      description: |
        Вызывает только сервер партнёра: ключ в адресе. Кампанию узнаём по click_id. Повтор с тем же order_id меняет статус
        (ждёт → засчитана или отклонена; засчитана → возврат), дубля не будет. Для заказа по промокоду нужна сумма amount в рублях.
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
        - { name: click_id, in: query, required: true, schema: { type: string } }
        - { name: order_id, in: query, required: true, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, approved, rejected, returned], default: pending } }
        - { name: amount, in: query, required: false, schema: { type: string, description: 'сумма заказа в рублях, 1200 или 1200.50' } }
      responses:
        '200':
          description: принято
          content:
            application/json:
              schema: { type: object, required: [ok, conversionId, created], properties: { ok: { const: true }, conversionId: { type: integer }, created: { type: boolean } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

components:
  responses:
    Error:
      description: ошибка
      content:
        application/json:
          schema: { type: object, required: [message], properties: { message: { type: string } } }
