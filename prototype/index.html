<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>МЁД: прототип кабинета</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<style>
  /* Только раскладка прототипа. Цвета, шрифты, формы — из дизайн-системы. */
  .wrap { padding-bottom: 120px; }
  .bl-btn svg { width: 20px; height: 20px; flex: none; }
  .brand { display: flex; align-items: center; gap: var(--space-s); color: var(--color-text-primary); }
  .brand__name { font: var(--type-label); }
  .brand__sub { font: var(--type-caption); color: var(--color-text-secondary); }

  /* лендинг */
  .hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: var(--space-3xl); align-items: center; padding: var(--space-5xl) 0 var(--space-6xl); }
  .hero__visual { aspect-ratio: 1; border-radius: var(--radius-1000); background: var(--color-background-secondary); box-shadow: var(--shadow-hero); display: grid; place-items: center; }
  .hero__moments { display: flex; flex-direction: column; gap: var(--space-s); width: 72%; }
  .moment { display: flex; justify-content: space-between; align-items: center; gap: var(--space-s); padding: var(--space-m) var(--space-l); border-radius: var(--radius-500); background: var(--color-background-primary); }
  .moment--hit { background: var(--color-background-secondary-invert); color: var(--color-text-primary-invert); }
  .section-head { display: flex; justify-content: space-between; align-items: end; gap: var(--space-l); flex-wrap: wrap; margin-bottom: var(--space-3xl); }
  .calc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4xl); align-items: center; }
  .footer { display: flex; justify-content: space-between; gap: var(--space-l); flex-wrap: wrap; padding: var(--space-3xl) 0; }

  /* вход */
  .center { min-height: calc(100vh - 90px); display: grid; place-items: center; padding: var(--space-3xl) 0; }
  .center .bl-modal { max-width: 560px; }
  .id-btn { justify-content: flex-start; gap: var(--space-m); }
  .id-badge { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; font: 500 15px/1 var(--font-primary); color: var(--color-constant-02); flex: none; }
  .id-badge--gos { background: var(--color-static-blue-600); }
  .id-badge--sber { background: var(--color-static-green-600); }
  .id-badge--alfa { background: var(--color-static-red-600); }
  .suggest { border-radius: var(--radius-400); background: var(--color-background-primary); overflow: hidden; }
  .suggest button { display: block; width: 100%; text-align: left; padding: var(--space-m); border: 0; background: none; font: var(--type-body); color: var(--color-text-primary); cursor: pointer; }
  .suggest button:hover { background: var(--color-background-tertiary); }

  /* шаги сценария */
  .flow-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-m); padding: var(--space-m) 0; }
  .flow-head > :last-child { justify-self: end; }
  .page-title { display: flex; justify-content: space-between; align-items: end; gap: var(--space-l); flex-wrap: wrap; margin: var(--space-2xl) 0 var(--space-l); }
  .two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--space-l); align-items: start; }
  .two--even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pad { padding: var(--space-3xl); max-width: none; margin: 0; }
  .sticky { position: sticky; top: var(--space-m); }
  .kv { display: grid; grid-template-columns: 160px 1fr; gap: var(--space-xs) var(--space-m); font: var(--type-body-tight); }
  .kv dt { color: var(--color-text-secondary); }
  .kv dd { margin: 0; }

  /* карта охвата */
  .map { position: relative; aspect-ratio: 4/3; border-radius: var(--radius-600); overflow: hidden; background: var(--color-background-primary); }
  .map svg { width: 100%; height: 100%; }
  .map__legend { position: absolute; left: var(--space-m); bottom: var(--space-m); }

  /* выбор карточкой */
  .choice { text-align: left; border: 2px solid transparent; cursor: pointer; font: inherit; transition: border-color var(--transition-fast); }
  .choice:hover { border-color: var(--color-background-tertiary); }
  .choice[aria-pressed="true"] { border-color: var(--color-border-primary); background: var(--color-background-secondary); }
  .choice[aria-pressed="true"] .choice__mark { background: var(--color-background-secondary-invert); color: var(--color-text-primary-invert); }
  .choice__mark { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--color-background-tertiary); color: transparent; flex: none; }
  .choice__mark svg { width: 16px; height: 16px; }

  /* превью креатива */
  .previews { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-m); }
  .phone-mini { border-radius: var(--radius-500); background: var(--color-background-primary); padding: var(--space-s); display: flex; flex-direction: column; gap: var(--space-xs); min-height: 260px; }
  .phone-mini__bar { height: 6px; width: 40%; border-radius: 3px; background: var(--color-background-tertiary); margin: 2px auto 6px; }
  .ad-img { border-radius: var(--radius-300); aspect-ratio: 16/10; display: grid; place-items: center; text-align: center; padding: var(--space-xs); font: var(--type-micro); color: var(--color-text-secondary); }
  .ad-img--0 { background: var(--color-surface-07); }
  .ad-img--1 { background: var(--color-surface-01); }
  .ad-img--2 { background: var(--color-surface-04); }
  .ad-card { border-radius: var(--radius-300); background: var(--color-background-secondary); padding: var(--space-s); display: flex; flex-direction: column; gap: 6px; font: var(--type-caption); }
  .ad-card b { font: var(--type-body-tight); font-weight: var(--font-weight-medium); }
  .paid-ok { display: flex; align-items: center; gap: var(--space-xs); font: var(--type-caption); padding: var(--space-xs) 0; }
  .paid-ok i { width: 24px; height: 24px; border-radius: 50%; background: var(--color-success-primary); color: var(--color-constant-02); display: grid; place-items: center; font-style: normal; }
  mark.stop { background: var(--color-background-error); color: var(--color-text-primary); border-radius: 4px; padding: 0 2px; text-decoration: underline wavy var(--color-error-primary); text-underline-offset: 3px; }

  /* сигналы */
  .sig-group { padding: var(--space-m) 0; border-top: 1px solid var(--color-border-secondary); }
  .sig-group:first-child { border-top: 0; padding-top: 0; }
  .sig { display: flex; align-items: center; gap: var(--space-s); padding: var(--space-xs) 0; }
  .sig__name { flex: 1; min-width: 0; }
  .sig.is-off { color: var(--color-text-tertiary); }
  .bucket { border-radius: var(--radius-400); background: var(--color-background-primary); padding: var(--space-m); display: flex; flex-direction: column; gap: var(--space-xs); }
  .bucket__chips { display: flex; flex-wrap: wrap; gap: var(--space-xs); min-height: 40px; align-items: center; }
  .bucket .bl-chip { background: var(--color-background-secondary); }
  .bucket.is-target { outline: 2px solid var(--color-border-primary); }

  /* нижняя панель сценария */
  .bottombar { position: sticky; bottom: var(--space-m); z-index: 10; margin-top: var(--space-l); display: flex; justify-content: space-between; align-items: center; gap: var(--space-m); flex-wrap: wrap; padding: var(--space-s) var(--space-s) var(--space-s) var(--space-l); border-radius: var(--radius-circle); background: var(--color-background-secondary); box-shadow: var(--shadow-float); }

  /* кабинет */
  .cab { display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: var(--space-l); padding: var(--space-m) 0 120px; }
  .cab-nav { position: sticky; top: var(--space-m); align-self: start; display: flex; flex-direction: column; gap: var(--space-m); padding: var(--space-l); border-radius: var(--radius-600); background: var(--color-background-secondary); --bl-contrast: var(--color-background-primary); }
  .cab-nav nav { display: flex; flex-direction: column; gap: 2px; }
  .cab-nav nav a { display: flex; align-items: center; gap: var(--space-s); padding: 10px var(--space-s); border-radius: var(--radius-circle); color: var(--color-text-primary); font: var(--type-body-tight); }
  .cab-nav nav a:hover { background: var(--color-background-primary); }
  .cab-nav nav a.is-active { background: var(--color-background-secondary-invert); color: var(--color-text-primary-invert); }
  .cab-nav nav svg { width: 20px; height: 20px; flex: none; }
  .cab-main { display: flex; flex-direction: column; gap: var(--space-l); min-width: 0; }
  .kpis { --bl-cols: 4; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 180px; padding-top: 32px; position: relative; }
  .bars > span:not(.bl-pill-dark) { flex: 1; border-radius: 6px 6px 3px 3px; background: var(--color-background-tertiary); transition: height var(--transition); }
  .bars span.is-hi { background: var(--color-background-secondary-invert); }
  .bars .bl-pill-dark { position: absolute; top: 0; right: 0; }
  .bl-table td + td { white-space: nowrap; }
  .axis { display: flex; justify-content: space-between; margin-top: var(--space-xs); }
  .live { display: inline-flex; align-items: center; gap: 6px; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--color-success-primary); animation: bl-pulse 1.4s ease-in-out infinite; }

  /* статус модерации */
  .status-list { display: flex; flex-direction: column; }
  .status { display: flex; gap: var(--space-m); align-items: flex-start; padding: var(--space-m) 0; }
  .status + .status { border-top: 1px solid var(--color-border-secondary); }
  .status__dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--color-background-tertiary); color: var(--color-text-tertiary); flex: none; }
  .status__dot svg { width: 16px; height: 16px; }
  .status.is-done .status__dot { background: var(--color-success-primary); color: var(--color-constant-02); }
  .status.is-wait .status__dot { animation: bl-pulse 1.4s ease-in-out infinite; }

  /* телефон для подписанта */
  .phone { width: 390px; max-width: 100%; margin: var(--space-3xl) auto; border-radius: 44px; background: var(--color-background-primary); box-shadow: var(--shadow-hero); border: 10px solid var(--color-background-secondary-invert); overflow: hidden; }
  .phone__in { min-height: 760px; padding: var(--space-l) var(--space-m); display: flex; flex-direction: column; gap: var(--space-m); }

  /* QR-заглушка */
  .qr { width: 180px; height: 180px; margin: 0 auto; border-radius: var(--radius-400); background: var(--color-background-primary); padding: 14px; }
  .qr svg { width: 100%; height: 100%; }

  /* служебная навигация по прототипу */
  .demo-fab { position: fixed; left: var(--space-m); bottom: 104px; z-index: 40; }
  .demo-map { max-width: 720px; max-height: calc(100vh - 32px); overflow: auto; }
  .demo-map h3 { margin: var(--space-l) 0 var(--space-xs); }
  .demo-map a { display: block; padding: 6px 0; }
  .demo-note { font: var(--type-micro); color: var(--color-text-secondary); display: inline-flex; gap: 6px; align-items: center; }
  .demo-note::before { content: "демо"; padding: 1px 6px; border-radius: var(--radius-circle); background: var(--color-surface-04); color: var(--color-static-violet-700); }
  .toast-host { position: fixed; left: 50%; bottom: var(--space-l); transform: translateX(-50%); z-index: 60; }

  @media (max-width: 1023px) {
    .hero, .calc, .two, .two--even { grid-template-columns: minmax(0, 1fr); }
    .hero__visual { max-width: 520px; }
    .sticky { position: static; }
    .previews { grid-template-columns: 1fr 1fr; }
    .cab { grid-template-columns: minmax(0, 1fr); }
    .cab-nav { position: static; padding: var(--space-s); min-width: 0; }
    .cab-nav nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
    .cab-nav nav a { flex: none; }
    .cab-nav .cab-nav__extra { display: none; }
  }
  @media (max-width: 767px) {
    .hero { padding: var(--space-l) 0 var(--space-3xl); }
    .flow-head { grid-template-columns: auto 1fr; }
    .flow-head .bl-steps { grid-column: 1 / -1; grid-row: 2; }
    .bl-steps { gap: var(--space-s); }
    .pad { padding: var(--space-l); }
    .previews { grid-template-columns: 1fr; }
    .kpis.bl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kv { grid-template-columns: 1fr; gap: 2px; }
    .kv dd { margin-bottom: var(--space-xs); }
    .bottombar { border-radius: var(--radius-600); padding: var(--space-s); }
    .phone { border: 0; border-radius: 0; margin: 0 calc(-1 * var(--page-side)); width: auto; box-shadow: none; }
  }
  @media print {
    .demo-fab, .bottombar, .flow-head, .no-print { display: none !important; }
    body { background: #fff; }
  }
</style>
</head>

  and.forEach(s => (reach *= Math.min(.6, s.reach / 6000 + .2)));

/* ───────── роутер ───────── */
const path = () => (location.hash.replace(/^#/, '').split('?')[0] || '/');
function rerender() { const y = scrollY; render(); scrollTo(0, y); }
function render() {
  clearInterval(live); clearTimeout(launchTimer);
  const r = R[path()] || R['/'];
  document.getElementById('app').innerHTML = r.view() + demo();
  document.title = `МЁД: ${r.name.replace(/^[\d.]+ · /, '')}`;
  refresh();
  r.mount?.();
}
addEventListener('hashchange', () => { if (!location.hash.startsWith('#/')) return; render(); scrollTo(0, 0); });

/* служебная карта экранов */
let demoOpen = false;
function demo() {
  const phases = [[1, 'вход и ага-момент'], [2, 'сборка кампании'], [3, 'оплата'], [4, 'кампания и рост']];
  return `<button class="bl-pill-dark demo-fab" style="border:0;cursor:pointer" data-act="demo" aria-expanded="${demoOpen}">экраны прототипа</button>
  ${demoOpen ? `<div class="bl-overlay" data-act="demoClose"><div class="bl-modal demo-map" role="dialog" aria-label="Карта экранов" onclick="event.stopPropagation()">
    <div class="bl-row" style="justify-content:space-between"><h2 class="bl-h2">карта экранов</h2><button class="bl-icon-btn" data-act="demo" aria-label="Закрыть">${I.x}</button></div>
    ${phases.map(([p, t]) => `<h3 class="bl-h4">${t}</h3>${Object.entries(R).filter(([, r]) => r.phase === p).map(([k, r]) => `<a href="#${k}" data-act="demoGo">${r.name}</a>`).join('')}`).join('')}
    <hr class="bl-divider" style="margin:24px 0 16px">
    <div class="bl-row"><span class="bl-caption" style="flex:1">Сегмент: ${seg('segment', [['small', 'малый'], ['medium', 'средний'], ['large', 'крупный']])}</span><button class="bl-btn bl-btn--s" data-act="reset">сбросить демо</button></div>
  </div></div>` : ''}`;
}

/* ───────── действия ───────── */
function toast(msg) {
  const host = document.getElementById('toast');
  host.innerHTML = `<div class="bl-toast">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => (host.innerHTML = ''), 3200);
}
function modal(html) {
  const el = document.createElement('div');
  el.className = 'bl-overlay'; el.innerHTML = `<div class="bl-modal bl-stack" style="--bl-gap:16px;text-align:center" role="dialog">${html}</div>`;
  document.body.append(el); return el;
}
const A = {
  login(p) {
    const box = document.getElementById('login-box');
    box.innerHTML = `<h1 class="bl-h2">переходим в ${PROVIDERS[p].name}…</h1><div class="bl-skeleton" style="height:56px"></div><div class="bl-skeleton" style="height:56px;width:70%"></div><p class="bl-caption">Подтвердите вход в приложении. Обычно это 10 секунд.</p>`;
    setTimeout(() => { S.provider = p; save(); location.hash = '#/consent'; }, 1300);
  },
  pickInn() { S.provider = 'inn'; save(); location.hash = '#/reach'; },
  idAtCheckout(p) { S.provider = p; save(); toast(`Вход через ${PROVIDERS[p].name}: реквизиты заполнены`); rerender(); },
  segEdit() { S.segEdit = !S.segEdit; rerender(); },
  editText() { S.editText = !S.editText; save(); rerender(); },
  nextImg() { S.img = (S.img + 1) % IMAGES.length; save(); rerender(); },
  fixText() { S.adText = adText().replace(stopHit(adText()).m[0], 'Свежая обжарка каждый день'); S.fixed = true; S.editText = false; save(); toast('Текст исправлен, модерацию пройдёт'); rerender(); },
  sig(id) { S.aud[id] = S.target; save(); rerender(); },
  unsig(id) { delete S.aud[id]; save(); rerender(); },
  specialSend() { S.special.sent = true; save(); rerender(); },
  specialReset() { S.special = structuredClone(INIT.special); save(); rerender(); },
  csv() {
    const rows = [['месяц', 'бюджет, ₽', 'клики', 'визиты'], ...planRows().map(r => [r.mo, Math.round(r.budget), Math.round(r.clicks), Math.round(r.visits)])];
    const blob = new Blob(['﻿' + rows.map(r => r.join(';')).join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'медиаплан-зерно.csv' });
    a.click(); URL.revokeObjectURL(a.href); toast('Медиаплан скачан, открывается в Excel');
  },
  print() { print(); },
  sendBoss() { S.sentToBoss = true; save(); rerender(); },
  pay() {
    if (S.pay === 'sbp') {
      const m = modal(`<h2 class="bl-h2">оплата по СБП</h2><div class="qr">${qrSvg()}</div><p class="bl-body">${n(D().amount)} ₽ · ${CO.name}</p><p class="bl-caption">Отсканируйте в приложении банка или откройте ссылку на телефоне</p><div class="bl-skeleton" style="height:4px"></div>`);
      setTimeout(() => { m.querySelector('.bl-modal').innerHTML = `<span class="bl-tag bl-tag--success" style="align-self:center">оплачено</span><h2 class="bl-h2">деньги на балансе</h2><p class="bl-caption">зачислено за [8] секунд, +[3 000] ₽ бонус</p>`; }, 2200);
      setTimeout(() => { m.remove(); paid(); }, 3600);
    } else if (S.pay === 'card') {
      const m = modal(`<h2 class="bl-h2">переходим на страницу банка</h2><div class="bl-skeleton" style="height:56px"></div><p class="bl-caption">Данные карты вводятся на стороне банка, мы их не видим</p>`);
      setTimeout(() => { m.remove(); paid(); }, 2000);
    } else { toast(S.pay === 'invoice' ? 'Счёт-оферта отправлен на почту. Запустим после зачисления' : 'Запускаем, счёт придёт в конце месяца'); paid(); }
  },
  approve() { S.approved = true; S.paid = true; S.launch = 0; save(); rerender(); },
  edo() { S.edo = true; save(); toast(`Приглашение отправлено в ${S.edoOp}. Примите его там`); rerender(); },
  invite() { const v = document.getElementById('acc-mail').value.trim(); if (!/.+@.+\..+/.test(v)) return toast('Введите почту бухгалтера'); toast(`Приглашение отправлено на ${v}`); },
  topup(v) { const m = modal(`<h2 class="bl-h2">пополнение на ${n(+v)} ₽</h2><div class="qr">${qrSvg()}</div><p class="bl-caption">СБП для бизнеса</p>`); setTimeout(() => { m.remove(); toast('Баланс пополнен'); }, 1800); },
  newCamp() { S.tab = null; S.adText = null; S.fixed = false; S.launch = 0; save(); },
  toast(v) { toast(v); },
  demo() { demoOpen = !demoOpen; rerender(); },
  demoClose() { demoOpen = false; rerender(); },
  demoGo() { demoOpen = false; },
  reset() { try { localStorage.removeItem(KEY); } catch {} S = structuredClone(INIT); demoOpen = false; location.hash = '#/'; render(); },
};
function paid() { S.paid = true; S.launch = 0; save(); location.hash = '#/launch'; }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-set],[data-toggle],[data-go]');
  if (!t || t.disabled) return;
  if (t.dataset.go) { location.hash = t.dataset.go; return; }
  if (t.dataset.toggle) { set(t.dataset.toggle, !get(t.dataset.toggle)); rerender(); return; }
  if (t.dataset.set === 'segment') S.tab = null;
  if (t.dataset.set) { set(t.dataset.set, 'num' in t.dataset ? +t.dataset.v : t.dataset.v); rerender(); return; }
  if (t.tagName === 'A' && t.dataset.act === 'toast') e.preventDefault();
  A[t.dataset.act]?.(t.dataset.v, t);
});
document.addEventListener('input', e => {
  const k = e.target.dataset.model; if (!k) return;
  const el = e.target;
  const v = el.type === 'checkbox' ? el.checked : el.type === 'range' ? +el.value : el.value;
  set(k, v);
  if (el.type === 'range' || 'live' in el.dataset) refresh(); else rerender();
});
document.addEventListener('change', e => { if (e.target.dataset.model && 'live' in e.target.dataset) rerender(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && demoOpen) A.demoClose(); });

render();
</script>
</body>
