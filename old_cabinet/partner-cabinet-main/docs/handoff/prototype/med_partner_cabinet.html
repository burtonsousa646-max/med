  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#202124;background:#f7f7f5;font-size:15px;--yellow:#f9d62f;--ink:#202124;--muted:#73777c;--line:#e8e8e5;--green:#137955;--blue:#2858a4}

    main{min-width:0}.topbar{height:74px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 36px;gap:14px}.crumb{font-size:13px;color:var(--muted)}.crumb strong{font-weight:700;color:var(--ink)}.top-actions{display:flex;align-items:center;gap:14px}.prototype{background:#f4f3ed;border:1px solid #e8e5d9;color:#63604f;border-radius:100px;font-size:12px;padding:6px 10px}.icon-btn{border:0;background:transparent;display:grid;place-items:center;width:35px;height:35px;border-radius:8px}.icon-btn:hover{background:#f2f2ef}.icon-btn svg{width:20px;height:20px}.content{max-width:1480px;margin:auto;padding:34px 36px 60px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:#8b8e91;font-size:11px;font-weight:800;margin-bottom:9px}h1{font-size:31px;letter-spacing:-.045em;line-height:1.15;margin:0 0 8px}h2{font-size:19px;letter-spacing:-.025em;margin:0}.sub{color:var(--muted);line-height:1.5;margin:0}.button{border:1px solid #d8d9d6;border-radius:9px;background:white;color:var(--ink);padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}.button:hover{background:#f2f2ee}.button.primary{background:var(--yellow);border-color:var(--yellow)}.button.primary:hover{background:#eac720}.button.small{padding:7px 10px;font-size:13px}.button svg{width:17px;height:17px}.head-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:19px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 1px 2px #15151505}.metric{padding:20px 21px;min-height:134px}.metric-label{color:#70767a;font-size:13px;margin-bottom:18px}.metric strong{font-size:28px;letter-spacing:-.045em;display:block;line-height:1}.metric .foot{font-size:12px;color:#8a8e91;margin-top:11px}.metric .delta{color:var(--green);font-weight:700}.two-col{grid-template-columns:minmax(0,1.64fr) minmax(280px,1fr);margin-bottom:18px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:21px 22px 0}.card-head p{font-size:12px;color:var(--muted);margin:5px 0 0}.card-body{padding:20px 22px 22px}.muted{color:var(--muted)}.chart{height:222px;display:flex;align-items:stretch;gap:11px;border-bottom:1px solid #ddd;position:relative;padding:14px 4px 0;margin:3px 0 24px;background:repeating-linear-gradient(to top,transparent 0,transparent 54px,#f0f0ed 55px)}.bar-col{flex:1;display:flex;justify-content:flex-end;align-items:center;flex-direction:column;position:relative}.bar{width:min(45px,75%);background:#f6d539;border-radius:5px 5px 0 0;transition:height .25s}.bar-col:nth-child(3n) .bar{background:#efc820}.bar-col span{position:absolute;top:100%;margin-top:8px;color:#868a8e;font-size:12px}.chart-caption{display:flex;gap:9px;align-items:center;font-size:12px;color:#666}.swatch{width:9px;height:9px;background:#f6d539;border-radius:2px}.channel{margin-bottom:17px}.channel:last-child{margin:0}.channel-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:7px}.channel-row strong{font-weight:700}.track{background:#f2f2ee;height:8px;border-radius:10px;overflow:hidden}.fill{height:100%;background:#242629;border-radius:10px}.channel:nth-child(2) .fill{background:#f0cc2d}.channel:nth-child(3) .fill{background:#8e9499}.channel:nth-child(4) .fill{background:#d5d8d9}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:29px 0 13px}.section-head button{border:0;background:none;font-weight:700;color:#585c60}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;text-align:left;min-width:670px}.table th{font-size:12px;color:#8c9094;background:#fafaf8;font-weight:700;border-bottom:1px solid var(--line);padding:13px 18px;white-space:nowrap}.table td{padding:17px 18px;border-bottom:1px solid #f0f0ee;font-size:13px;vertical-align:middle}.table tbody tr:last-child td{border-bottom:none}.table tbody tr:hover{background:#fffdf3}.title-cell b{display:block;font-size:14px}.title-cell small{display:block;color:#92969a;margin-top:4px}.pill{display:inline-flex;border-radius:100px;padding:5px 9px;font-size:11px;font-weight:700;white-space:nowrap}.pill.live{background:#e8f5ee;color:#16805c}.pill.review{background:#fff5d7;color:#8a6200}.pill.draft{background:#f1f2f2;color:#71777b}.pill.done{background:#e9f0fb;color:#2d61a9}.pill.issue{background:#fff0eb;color:#b65b38}.link{border:0;background:none;color:#3c4750;text-decoration:underline;text-decoration-color:#bbc0c2;text-underline-offset:3px;font-size:13px;padding:4px}.steps{display:grid;gap:11px}.step{display:flex;align-items:flex-start;gap:12px;padding:13px;border:1px solid #efefec;border-radius:10px}.step .num{width:24px;height:24px;flex:0 0 24px;display:grid;place-items:center;background:#f8da53;border-radius:50%;font-size:12px;font-weight:800}.step b{font-size:13px}.step small{display:block;color:#898d90;line-height:1.4;margin-top:3px}.step.done-step .num{background:#e4f3eb;color:#13805b}.tip{margin-top:16px;padding:14px;border-radius:11px;background:#fff9db;color:#6b5a22;font-size:13px;line-height:1.5}.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.search,.select,.field input,.field select,.field textarea{border:1px solid #dadcd9;border-radius:9px;background:#fff;padding:10px 12px;color:var(--ink)}.search{min-width:260px;flex:1}.select{min-width:155px}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:7px}.page-intro{margin-bottom:18px}.info-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.info-row .card{padding:18px}.info-row b{display:block;font-size:20px;margin-top:8px}.info-row span{font-size:12px;color:var(--muted)}.funnel{display:flex;align-items:center;gap:8px}.funnel .node{min-width:0;flex:1;border:1px solid #e8e8e4;border-radius:11px;padding:17px}.funnel .node b{display:block;font-size:22px;margin:8px 0}.funnel .node small{color:var(--muted)}.funnel .arrow{color:#aaa}.callout{padding:17px 20px;background:#fff9df;border:1px solid #f4e8af;border-radius:12px;line-height:1.5;font-size:13px;margin-top:17px}.callout b{display:block;margin-bottom:3px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.detail-grid .card{padding:21px}.detail-grid dl{display:grid;grid-template-columns:140px 1fr;gap:12px;font-size:13px}.detail-grid dt{color:var(--muted)}.detail-grid dd{margin:0;font-weight:600}.ledger{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.ledger:last-child{border:0}.ledger span{color:var(--muted)}.modal-layer{position:fixed;inset:0;background:#15151588;display:grid;place-items:center;padding:16px;z-index:20}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:white;border-radius:16px;box-shadow:0 20px 80px #0003}.modal-head{padding:22px 24px 12px;display:flex;justify-content:space-between;align-items:start}.modal-head h2{font-size:23px}.modal-content{padding:10px 24px 24px}.field{display:grid;gap:7px;margin-bottom:16px}.field label{font-size:13px;font-weight:700}.field small{color:var(--muted);font-size:12px}.field textarea{min-height:85px;resize:vertical}.modal-footer{display:flex;justify-content:flex-end;gap:9px;margin-top:23px}.toast{position:fixed;bottom:23px;right:23px;background:#242628;color:white;padding:13px 17px;border-radius:10px;box-shadow:0 10px 30px #0002;z-index:30;font-size:13px}.mobile-menu{display:none}.notice{font-size:13px;color:#6b6e70;line-height:1.5}.tag{color:#73777c;font-size:12px}.small-stack{display:grid;gap:12px}
    @media(max-width:1100px){.metrics{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.sidebar{width:218px}.shell{grid-template-columns:218px minmax(0,1fr)}}
    @media(max-width:760px){.shell{display:block}.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:15;transform:translateX(-102%);width:260px;transition:transform .2s}.sidebar.open{transform:none}.mobile-menu{display:grid}.topbar{padding:0 17px;height:63px}.content{padding:25px 16px 50px}.head{display:block}.head-actions{margin-top:18px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:15px;min-height:118px}.metric strong{font-size:23px}.metric-label{margin-bottom:13px}.prototype{display:none}.info-row{grid-template-columns:1fr}.funnel{display:grid;grid-template-columns:1fr 1fr}.funnel .arrow{display:none}.detail-grid{grid-template-columns:1fr}.chart{height:180px}.card-head,.card-body{padding-left:16px;padding-right:16px}.crumb{font-size:12px}}
    @media(max-width:420px){.metrics{grid-template-columns:1fr 1fr}.metric strong{font-size:21px}.head-actions .button{flex:1}.search{min-width:100%}.select{flex:1}.funnel{grid-template-columns:1fr}.account{padding-bottom:8px}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><strong>МЁД</strong><span>by beeline</span></div>
    <div><div class="side-label">Рабочее пространство</div><nav class="nav" id="nav"></nav></div>
    <div class="side-bottom"><div class="demo-side">Демонстрационный прототип. Все партнёры, заказы и показатели на этой странице вымышлены.</div><div class="account"><div class="avatar">П</div><div><b>Партнёр: «Точка впечатлений»</b><small>Демоаккаунт · Администратор</small></div></div></div>
  </aside>
  <main><header class="topbar"><div class="top-actions"><button class="icon-btn mobile-menu" id="menuBtn" aria-label="Открыть меню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><span class="crumb">МЁД <span style="padding:0 7px;color:#babdbf">/</span> <strong id="crumb">Обзор</strong></span></div><div class="top-actions"><span class="prototype">Интерактивный прототип</span><button class="icon-btn" id="bellBtn" aria-label="Уведомления" title="Уведомления"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg></button></div></header><div class="content" id="view"></div></main>
</div>
<div id="overlay"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const icons={home:'<path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/>',offers:'<path d="M4 4h12l4 4v12H4zM16 4v4h4M7 12h10M7 16h7"/>',campaigns:'<path d="m3 11 13-6v14L3 13zM16 9l4-2v10l-4-2M5 14l2 6h4l-2-5"/>',orders:'<path d="M4 5h16v15H4zM7 3v4M17 3v4M4 10h16M8 14h4M8 17h6"/>',analytics:'<path d="M4 20V11m5 9V5m5 15v-7m5 7V9M2 20h20"/>',money:'<path d="M3 6h18v13H3zM3 10h18M7 15h3M15 15h3"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4.1 1.9C12.5 12 12 12.5 12 14m0 3h.01"/>'};
const icon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.home}</svg>`;
const navItems=[['home','Обзор'],['offers','Мои предложения'],['campaigns','Продвижение'],['orders','Заказы'],['analytics','Аналитика'],['money','Расчёты'],['help','Поддержка']];
const seedOffers=[{id:'OF-1042',name:'Скидка 20% на билеты',type:'Купон',status:'live',price:'от 1 200 ₽',views:18420,sales:326},{id:'OF-1038',name:'Выходные для двоих',type:'Промокод',status:'live',price:'от 4 900 ₽',views:9610,sales:91},{id:'OF-1033',name:'Мастер-класс по керамике',type:'Купон',status:'review',price:'2 300 ₽',views:0,sales:0},{id:'OF-1025',name:'Семейный билет',type:'Купон',status:'draft',price:'3 500 ₽',views:0,sales:0}];
const seedOrders=[{id:'MD-28364',date:'24.09.2026',offer:'Скидка 20% на билеты',channel:'Приложение билайн',sum:2400,payout:1920,status:'new'},{id:'MD-28311',date:'23.09.2026',offer:'Выходные для двоих',channel:'Push',sum:4900,payout:3920,status:'done'},{id:'MD-28294',date:'22.09.2026',offer:'Скидка 20% на билеты',channel:'CVM / SMS',sum:1200,payout:960,status:'done'},{id:'MD-28217',date:'20.09.2026',offer:'Семейный билет',channel:'Приложение билайн',sum:3500,payout:2800,status:'issue'}];
const seedCampaigns=[{name:'Билеты к выходным',offer:'Скидка 20% на билеты',channel:'Приложение билайн',audience:'Интерес к досугу',status:'live',reach:'28 400',sales:326},{name:'Поездка на выходные',offer:'Выходные для двоих',channel:'Push + CVM',audience:'Собираются в поездку',status:'review',reach:'—',sales:0}];
const state={page:'home',period:'30',offers:seedOffers,orders:seedOrders,campaigns:seedCampaigns,search:'',filter:'all'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';
const status=(s)=>({live:['Опубликовано','live'],review:['На модерации','review'],draft:['Черновик','draft'],done:['Исполнен','done'],new:['Новый','review'],issue:['Нужна проверка','issue'],planned:['Запланирована','draft']}[s]||[s,'draft']);
const pill=s=>`<span class="pill ${status(s)[1]}">${status(s)[0]}</span>`;
const periodLabel=()=>state.period==='7'?'7 дней':state.period==='90'?'90 дней':'30 дней';
const header=(title,sub,actions='')=>`<div class="head"><div><div class="eyebrow">Кабинет партнёра</div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div><div class="head-actions">${actions}</div></div>`;
const periodSelect=()=>`<select class="select" id="period" aria-label="Период"><option value="7" ${state.period==='7'?'selected':''}>Последние 7 дней</option><option value="30" ${state.period==='30'?'selected':''}>Последние 30 дней</option><option value="90" ${state.period==='90'?'selected':''}>Последние 90 дней</option></select>`;
const metric=(label,value,foot)=>`<article class="card metric"><div class="metric-label">${label}</div><strong>${value}</strong><div class="foot">${foot}</div></article>`;
function offerRows(data){return data.map(o=>`<tr><td class="title-cell"><b>${esc(o.name)}</b><small>${esc(o.id)} · ${esc(o.type)}</small></td><td>${pill(o.status)}</td><td>${esc(o.price)}</td><td>${new Intl.NumberFormat('ru-RU').format(o.views)}</td><td>${o.sales}</td><td><button class="link" data-offer="${esc(o.id)}">Открыть</button></td></tr>`).join('')}
const offerTable=(items)=>`<div class="card table-wrap"><table class="table"><thead><tr><th>Предложение</th><th>Статус</th><th>Цена для клиента</th><th>Просмотры</th><th>Заказы</th><th></th></tr></thead><tbody>${items.length?offerRows(items):'<tr><td colspan="6"><div class="empty"><b>Предложений не найдено</b>Попробуйте другой запрос или статус.</div></td></tr>'}</tbody></table></div>`;
function home(){return header('Здравствуйте, партнёр','Главное по вашим предложениям и заказам.',`<button class="button primary" data-action="new-offer">＋ Добавить предложение</button>`)+`<div class="grid metrics">${metric('Просмотры предложений','28 030','за последние '+periodLabel())}${metric('Заказы','417','демонстрационные данные')}${metric('Конверсия','1,49%','заказов / просмотров')}${metric('К выплате','386 400 ₽','по подтверждённым заказам')}</div><div class="grid two-col"><article class="card"><div class="card-head"><div><h2>Заказы по дням</h2><p>Последние ${periodLabel()}, пример динамики</p></div>${periodSelect()}</div><div class="card-body"><div class="chart" aria-label="Демонстрационный график заказов"><div class="bar-col"><div class="bar" style="height:32%"></div><span>Пн</span></div><div class="bar-col"><div class="bar" style="height:46%"></div><span>Вт</span></div><div class="bar-col"><div class="bar" style="height:42%"></div><span>Ср</span></div><div class="bar-col"><div class="bar" style="height:67%"></div><span>Чт</span></div><div class="bar-col"><div class="bar" style="height:61%"></div><span>Пт</span></div><div class="bar-col"><div class="bar" style="height:87%"></div><span>Сб</span></div><div class="bar-col"><div class="bar" style="height:76%"></div><span>Вс</span></div></div><div class="chart-caption"><i class="swatch"></i> Оформленные заказы · пример недели</div></div></article><article class="card"><div class="card-head"><div><h2>Откуда приходят клиенты</h2><p>Доля заказов по каналам</p></div></div><div class="card-body"><div class="channel"><div class="channel-row"><span>Приложение билайн</span><strong>58%</strong></div><div class="track"><div class="fill" style="width:58%"></div></div></div><div class="channel"><div class="channel-row"><span>Персональные предложения CVM</span><strong>24%</strong></div><div class="track"><div class="fill" style="width:24%"></div></div></div><div class="channel"><div class="channel-row"><span>Push-уведомления</span><strong>12%</strong></div><div class="track"><div class="fill" style="width:12%"></div></div></div><div class="channel"><div class="channel-row"><span>Другие каналы</span><strong>6%</strong></div><div class="track"><div class="fill" style="width:6%"></div></div></div><div class="tip">Партнёр видит продажи и вклад каждого канала после запуска оффера.</div></div></article></div><div class="section-head"><h2>Мои предложения</h2><button data-page="offers">Все предложения →</button></div>${offerTable(state.offers.slice(0,3))}<div class="section-head"><h2>Что дальше</h2></div><div class="card card-body"><div class="steps"><div class="step done-step"><span class="num">✓</span><div><b>Профиль компании заполнен</b><small>Реквизиты и контакты добавлены</small></div></div><div class="step done-step"><span class="num">✓</span><div><b>Первый оффер опубликован</b><small>Предложение доступно клиентам</small></div></div><div class="step"><span class="num">3</span><div><b>Проверьте новый оффер на модерации</b><small>После одобрения можно настроить продвижение</small></div></div></div></div>`}
function offers(){let q=state.search.toLowerCase();let items=state.offers.filter(o=>(state.filter==='all'||o.status===state.filter)&&(!q||(o.name+' '+o.id+' '+o.type).toLowerCase().includes(q)));return header('Мои предложения','Создавайте, публикуйте и обновляйте офферы для клиентов билайн.',`<button class="button primary" data-action="new-offer">＋ Добавить предложение</button>`)+`<div class="grid info-row"><div class="card"><span>Опубликовано</span><b>${state.offers.filter(o=>o.status==='live').length}</b></div><div class="card"><span>На модерации</span><b>${state.offers.filter(o=>o.status==='review').length}</b></div><div class="card"><span>Черновики</span><b>${state.offers.filter(o=>o.status==='draft').length}</b></div></div><div class="toolbar"><input class="search" id="search" placeholder="Поиск по названию или ID" value="${esc(state.search)}" aria-label="Поиск предложений"><select class="select" id="filter" aria-label="Статус"><option value="all">Все статусы</option><option value="live" ${state.filter==='live'?'selected':''}>Опубликовано</option><option value="review" ${state.filter==='review'?'selected':''}>На модерации</option><option value="draft" ${state.filter==='draft'?'selected':''}>Черновики</option></select></div>${offerTable(items)}<div class="callout"><b>Путь нового предложения</b>Заполните условия и способ исполнения → отправьте на модерацию → выберите каналы продвижения → принимайте и исполняйте заказы.</div>`}
function campaigns(){return header('Продвижение','Управляйте показами офферов в каналах билайн.',`<button class="button primary" data-action="new-campaign">＋ Запланировать кампанию</button>`)+`<div class="grid info-row"><div class="card"><span>Показы за период</span><b>64 900</b></div><div class="card"><span>Переходы</span><b>1 820</b></div><div class="card"><span>Заказы с кампаний</span><b>326</b></div></div><div class="card table-wrap"><table class="table"><thead><tr><th>Кампания</th><th>Предложение</th><th>Канал</th><th>Аудитория</th><th>Охват</th><th>Заказы</th><th>Статус</th></tr></thead><tbody>${state.campaigns.map(c=>`<tr><td class="title-cell"><b>${esc(c.name)}</b></td><td>${esc(c.offer)}</td><td>${esc(c.channel)}</td><td>${esc(c.audience)}</td><td>${esc(c.reach)}</td><td>${c.sales}</td><td>${pill(c.status)}</td></tr>`).join('')}</tbody></table></div><div class="callout"><b>Как запускается продвижение</b>Партнёр предлагает оффер и аудиторию. Команда МЁД проверяет условия, доступность каналов и согласует запуск. Подбор аудитории и отправка сообщений в прототипе не выполняются.</div>`}
function orders(){return header('Заказы','Отслеживайте покупки и отмечайте исполнение.',`<button class="button" data-action="csv">↓ Скачать CSV</button>`)+`<div class="grid info-row"><div class="card"><span>Новые</span><b>${state.orders.filter(o=>o.status==='new').length}</b></div><div class="card"><span>Исполнены</span><b>${state.orders.filter(o=>o.status==='done').length}</b></div><div class="card"><span>Требуют внимания</span><b>${state.orders.filter(o=>o.status==='issue').length}</b></div></div><div class="card table-wrap"><table class="table"><thead><tr><th>Заказ</th><th>Предложение</th><th>Канал</th><th>Сумма</th><th>Партнёру</th><th>Статус</th><th></th></tr></thead><tbody>${state.orders.map(o=>`<tr><td class="title-cell"><b>${esc(o.id)}</b><small>${esc(o.date)}</small></td><td>${esc(o.offer)}</td><td>${esc(o.channel)}</td><td>${money(o.sum)}</td><td>${money(o.payout)}</td><td>${pill(o.status)}</td><td><button class="link" data-order="${esc(o.id)}">Подробнее</button></td></tr>`).join('')}</tbody></table></div><div class="callout">Данные клиента в прототипе скрыты. В рабочем продукте партнёр получит только сведения, необходимые для исполнения заказа.</div>`}
function analytics(){return header('Аналитика','Просмотры, покупки и вклад каналов по вашим предложениям.',periodSelect())+`<div class="grid metrics">${metric('Показы','64 900','за '+periodLabel())}${metric('Просмотры','28 030','открытия карточек')}${metric('Заказы','417','оформленные покупки')}${metric('Конверсия','1,49%','заказы / просмотры')}</div><div class="card card-body"><h2 style="margin-bottom:18px">Воронка клиента</h2><div class="funnel"><div class="node"><small>Показ предложения</small><b>64 900</b><small>100%</small></div><span class="arrow">→</span><div class="node"><small>Просмотр карточки</small><b>28 030</b><small>43,2% от показов</small></div><span class="arrow">→</span><div class="node"><small>Оформлен заказ</small><b>417</b><small>1,49% от просмотров</small></div></div></div><div class="section-head"><h2>По предложениям</h2></div>${offerTable(state.offers.filter(o=>o.status==='live'))}<div class="callout">Метрики и названия каналов здесь показаны для обсуждения структуры ЛК. Подключения к CVM, биллингу и аналитике пока нет.</div>`}
function settlements(){return header('Расчёты','Проверяйте начисления, удержания и историю выплат.',`<button class="button" data-action="settlement-csv">↓ Скачать реестр</button>`)+`<div class="grid metrics">${metric('Оборот заказов','483 000 ₽','за сентябрь')}${metric('Вознаграждение МЁД','96 600 ₽','пример: 20% от оборота')}${metric('Начислено партнёру','386 400 ₽','оборот за вычетом вознаграждения')}${metric('Ожидает выплаты','386 400 ₽','после сверки заказов')}</div><div class="detail-grid"><div class="card"><h2>Сверка за сентябрь</h2><div style="margin-top:16px"><div class="ledger"><span>Оплаченные заказы</span><b>483 000 ₽</b></div><div class="ledger"><span>Возвраты</span><b>0 ₽</b></div><div class="ledger"><span>Вознаграждение платформы</span><b>−96 600 ₽</b></div><div class="ledger"><span>К выплате партнёру</span><b>386 400 ₽</b></div></div></div><div class="card"><h2>Порядок расчётов</h2><p class="notice">1. Клиент оплачивает заказ.<br><br>2. Партнёр исполняет обязательство.<br><br>3. Стороны сверяют заказы, возвраты и вознаграждение.<br><br>4. Выплата проводится по согласованному договору и графику.</p><p class="tag">Условия зависят от схемы оплаты и договора. Здесь показан пример для обсуждения.</p></div></div>`}
function help(){return header('Поддержка','Вопросы по офферам, заказам, интеграции и расчётам.',`<button class="button primary" data-action="support">＋ Написать в поддержку</button>`)+`<div class="detail-grid"><div class="card"><h2>Мои обращения</h2><div class="ledger" style="margin-top:15px"><div><b>Проверка оффера OF-1033</b><div class="tag" style="margin-top:5px">#SP-214 · 23 сентября</div></div>${pill('review')}</div><div class="ledger"><div><b>Уточнение по выплатам</b><div class="tag" style="margin-top:5px">#SP-188 · 18 сентября</div></div>${pill('done')}</div></div><div class="card"><h2>По каким вопросам писать</h2><div class="small-stack" style="margin-top:17px"><div class="step"><span class="num">1</span><div><b>Оффер и модерация</b><small>Условия акции, материалы, ограничения</small></div></div><div class="step"><span class="num">2</span><div><b>Заказ и исполнение</b><small>Статус, возврат, передача заказа</small></div></div><div class="step"><span class="num">3</span><div><b>Расчёты и интеграция</b><small>Реестры, API, технические вопросы</small></div></div></div></div></div>`}
const pages={home,offers,campaigns,orders,analytics,money:settlements,help};
function render(){document.getElementById('nav').innerHTML=navItems.map(([key,label])=>`<button type="button" data-page="${key}" class="${state.page===key?'active':''}" ${state.page===key?'aria-current="page"':''}>${icon(key)} ${label}</button>`).join('');document.getElementById('crumb').textContent=navItems.find(x=>x[0]===state.page)[1];document.getElementById('view').innerHTML=pages[state.page]();document.getElementById('sidebar').classList.remove('open')}
function toast(message){const el=document.getElementById('toast');el.innerHTML=`<div class="toast">${esc(message)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.innerHTML='',3900)}
function modal(title,body,wide=false){document.getElementById('overlay').innerHTML=`<div class="modal-layer" id="modalLayer"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" ${wide?'style="width:min(680px,100%)"':''}><div class="modal-head"><h2 id="modalTitle">${title}</h2><button class="icon-btn" data-action="close" aria-label="Закрыть">✕</button></div><div class="modal-content">${body}</div></div></div>`;document.querySelector('#modalLayer .icon-btn').focus()}
function close(){document.getElementById('overlay').innerHTML=''}
function newOffer(){modal('Новое предложение',`<p class="notice">Заполните основные условия. Предложение сохранится как черновик в этом браузере до перезагрузки страницы.</p><form id="offerForm"><div class="field"><label for="offerName">Название предложения *</label><input id="offerName" name="name" required maxlength="70" placeholder="Например, 20% на семейный билет"></div><div class="field"><label for="offerType">Формат</label><select id="offerType" name="type"><option>Купон</option><option>Промокод</option><option>Подписка</option><option>Услуга</option></select></div><div class="field"><label for="offerPrice">Цена для клиента *</label><input id="offerPrice" name="price" required placeholder="Например, 1 990 ₽"></div><div class="field"><label for="offerDesc">Условия и ограничения</label><textarea id="offerDesc" name="desc" placeholder="Где и как клиент использует предложение"></textarea></div><div class="modal-footer"><button type="button" class="button" data-action="close">Отмена</button><button type="submit" class="button primary">Сохранить черновик</button></div></form>`)}
function newCampaign(){modal('Запланировать продвижение',`<p class="notice">Оставьте заявку на продвижение. Канал и аудитория требуют согласования с командой МЁД.</p><form id="campaignForm"><div class="field"><label for="campName">Название кампании *</label><input id="campName" name="name" required maxlength="70"></div><div class="field"><label for="campOffer">Предложение</label><select id="campOffer" name="offer">${state.offers.filter(x=>x.status==='live').map(o=>`<option>${esc(o.name)}</option>`).join('')}</select></div><div class="field"><label for="campChannel">Желаемый канал</label><select id="campChannel" name="channel"><option>Приложение билайн</option><option>Push + CVM</option><option>SMS</option><option>Салоны билайн</option></select></div><div class="field"><label for="campAudience">Кому показать</label><input id="campAudience" name="audience" placeholder="Например, интерес к путешествиям"></div><div class="modal-footer"><button type="button" class="button" data-action="close">Отмена</button><button type="submit" class="button primary">Создать заявку</button></div></form>`)}
function support(){modal('Новое обращение',`<form id="supportForm"><div class="field"><label for="supportTopic">Тема</label><select id="supportTopic" name="topic"><option>Оффер и модерация</option><option>Заказы</option><option>Расчёты</option><option>Интеграция</option></select></div><div class="field"><label for="supportText">Сообщение *</label><textarea id="supportText" name="text" required placeholder="Опишите вопрос"></textarea></div><div class="modal-footer"><button type="button" class="button" data-action="close">Отмена</button><button type="submit" class="button primary">Сохранить обращение</button></div></form><p class="tag">В этом прототипе обращение никуда не отправляется.</p>`)}
function offerDetail(id){let o=state.offers.find(x=>x.id===id);if(!o)return;modal(esc(o.name),`<div class="detail-grid"><div><dl><dt>Номер</dt><dd>${esc(o.id)}</dd><dt>Формат</dt><dd>${esc(o.type)}</dd><dt>Цена</dt><dd>${esc(o.price)}</dd><dt>Статус</dt><dd>${pill(o.status)}</dd></dl></div><div><dl><dt>Просмотры</dt><dd>${o.views}</dd><dt>Заказы</dt><dd>${o.sales}</dd><dt>Конверсия</dt><dd>${o.views?(o.sales/o.views*100).toFixed(2).replace('.',',')+'%':'—'}</dd></dl></div></div><div class="callout"><b>Следующий шаг</b>${o.status==='draft'?'Дополните условия и отправьте оффер на модерацию.':o.status==='review'?'Команда МЁД проверит условия и материалы предложения.':'Проверьте результаты и при необходимости запланируйте продвижение.'}</div><div class="modal-footer"><button class="button" data-action="close">Закрыть</button>${o.status==='draft'?`<button class="button primary" data-publish="${esc(o.id)}">Отправить на модерацию</button>`:''}</div>`,true)}
function orderDetail(id){let o=state.orders.find(x=>x.id===id);if(!o)return;modal('Заказ '+esc(o.id),`<dl class="detail-grid" style="grid-template-columns:160px 1fr;gap:13px;font-size:13px"><dt class="muted">Дата</dt><dd style="margin:0">${esc(o.date)}</dd><dt class="muted">Предложение</dt><dd style="margin:0">${esc(o.offer)}</dd><dt class="muted">Канал</dt><dd style="margin:0">${esc(o.channel)}</dd><dt class="muted">Сумма заказа</dt><dd style="margin:0">${money(o.sum)}</dd><dt class="muted">Начисление партнёру</dt><dd style="margin:0">${money(o.payout)}</dd><dt class="muted">Статус</dt><dd style="margin:0">${pill(o.status)}</dd></dl><div class="callout">Пример расчёта: сумма заказа за вычетом вознаграждения платформы. Фактическая схема определяется договором.</div><div class="modal-footer"><button class="button" data-action="close">Закрыть</button>${o.status==='new'?`<button class="button primary" data-complete="${esc(o.id)}">Отметить исполненным</button>`:''}</div>`)}
function download(name,rows){let blob=new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('click',e=>{let t=e.target.closest('[data-page],[data-action],[data-offer],[data-order],[data-publish],[data-complete]');if(!t){if(e.target.id==='modalLayer')close();return}if(t.dataset.page){state.page=t.dataset.page;state.search='';state.filter='all';render();window.scrollTo(0,0)}if(t.dataset.offer)offerDetail(t.dataset.offer);if(t.dataset.order)orderDetail(t.dataset.order);if(t.dataset.publish){let o=state.offers.find(x=>x.id===t.dataset.publish);o.status='review';close();render();toast('Оффер отправлен на модерацию в прототипе')}if(t.dataset.complete){let o=state.orders.find(x=>x.id===t.dataset.complete);o.status='done';close();render();toast('Заказ отмечен исполненным в прототипе')}if(t.dataset.action){const a=t.dataset.action;if(a==='close')close();if(a==='new-offer')newOffer();if(a==='new-campaign')newCampaign();if(a==='support')support();if(a==='csv'){download('med_orders_demo.csv',[['Заказ','Дата','Предложение','Канал','Сумма','Партнёру','Статус'],...state.orders.map(o=>[o.id,o.date,o.offer,o.channel,o.sum,o.payout,status(o.status)[0]])]);toast('Демонстрационный реестр скачан')}if(a==='settlement-csv'){download('med_settlement_demo.csv',[['Период','Оборот','Вознаграждение платформы','К выплате'],['Сентябрь 2026',483000,96600,386400]]);toast('Демонстрационный реестр скачан')}}});
document.addEventListener('change',e=>{if(e.target.id==='period'){state.period=e.target.value;render()}if(e.target.id==='filter'){state.filter=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;const list=state.offers.filter(o=>(state.filter==='all'||o.status===state.filter)&&(o.name+' '+o.id+' '+o.type).toLowerCase().includes(state.search.toLowerCase()));document.querySelector('.table tbody').innerHTML=list.length?offerRows(list):'<tr><td colspan="6"><div class="empty"><b>Предложений не найдено</b>Попробуйте другой запрос или статус.</div></td></tr>'}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target;if(f.id==='offerForm'){let d=new FormData(f);state.offers.unshift({id:'OF-'+Math.floor(1100+Math.random()*8000),name:String(d.get('name')).trim(),type:String(d.get('type')),status:'draft',price:String(d.get('price')).trim(),views:0,sales:0});state.page='offers';close();render();toast('Черновик создан в прототипе')}if(f.id==='campaignForm'){let d=new FormData(f);state.campaigns.unshift({name:String(d.get('name')).trim(),offer:String(d.get('offer')),channel:String(d.get('channel')),audience:String(d.get('audience')).trim()||'Аудитория уточняется',status:'review',reach:'—',sales:0});state.page='campaigns';close();render();toast('Заявка добавлена в прототип')}if(f.id==='supportForm'){close();toast('Обращение сохранено только в прототипе')}});
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('bellBtn').onclick=()=>toast('Оффер OF-1033 ожидает модерации · демонстрация');document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
</script>
</body>
</html>
