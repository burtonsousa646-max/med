syntax = "proto3";

package platform.notifications.v1;

import "google/protobuf/timestamp.proto";

// Только доверенные сервисы. Инициатор определяется по идентичности соединения.
service NotificationsService {
  // Повтор исходного поручения возвращает текущее состояние начатых попыток.
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);
}

message SendNotificationRequest {
  // UUID, стабильный для всех повторов одного поручения.
  string dispatch_id = 1;
  string text = 2;
  // В TypeScript-клиенте ключ обязателен. undefined опускается при сериализации.
  optional string email = 3;
  // Для отправки только по email инициатор явно указывает phone: undefined.
  optional string phone = 4;
  // Для каждого запрошенного канала возвращается отдельный результат.
  repeated NotificationChannel channels = 5;
  // Верхняя граница начала передачи. Обязательна для кодов и приглашений.
  google.protobuf.Timestamp expires_at = 6;
  // Явный повтор временных, заведомо не принятых попыток. UUID получены из ответа.
  repeated string retry_attempt_ids = 7;
}

enum NotificationChannel {
  NOTIFICATION_CHANNEL_UNSPECIFIED = 0;
  NOTIFICATION_CHANNEL_EMAIL = 1;
  NOTIFICATION_CHANNEL_TELEGRAM = 2;
  // До подключения адаптера результат — NOT_SENT с причиной unsupported_channel.
  NOTIFICATION_CHANNEL_MAX = 3;
}

enum SubmissionStatus {
  SUBMISSION_STATUS_UNSPECIFIED = 0;
  SUBMISSION_STATUS_SENT = 1;
  SUBMISSION_STATUS_NOT_SENT = 2;
  SUBMISSION_STATUS_UNCONFIRMED = 3;
}

message ChannelResult {
  NotificationChannel channel = 1;
  SubmissionStatus status = 2;
  // Стабильная безопасная причина из словаря дизайна.
  optional string reason = 3;
  // Отсутствует для пропусков до создания попытки.
  optional string attempt_id = 4;
  bool retryable = 5;
}

message SendNotificationResponse {
  string dispatch_id = 1;
  repeated ChannelResult results = 2;
}
